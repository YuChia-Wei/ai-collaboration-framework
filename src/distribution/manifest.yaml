        destination: .ai/core/skills/lesson/references/operations.md
      - source: references/example.md
        destination: .ai/core/skills/lesson/references/example.md
      - source: schemas/lesson-record.schema.json
        destination: .ai/core/skills/lesson/schemas/lesson-record.schema.json
      - source: schemas/lesson-record-v2.schema.json
        destination: .ai/core/skills/lesson/schemas/lesson-record-v2.schema.json
      - source: templates/lesson.md
        destination: .ai/core/skills/lesson/templates/lesson.md
      - source: scripts/lesson.py
        destination: .ai/core/skills/lesson/scripts/lesson.py

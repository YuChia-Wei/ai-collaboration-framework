manifest_version: 1
profiles:
  - id: lesson-minimal
    path: src/profiles/lesson-minimal.yaml
  - id: knowledge
    path: src/profiles/knowledge.yaml
  - id: work-management
    path: src/profiles/work-management.yaml
  - id: collaboration
    path: src/profiles/collaboration.yaml
components:
  - id: lesson
    source: src/skills/lesson
    metadata: skill-package.yaml
    members:
      - source: SKILL.md
        destination: .ai/core/skills/lesson/SKILL.md
      - source: skill-package.yaml
        destination: .ai/core/skills/lesson/skill-package.yaml

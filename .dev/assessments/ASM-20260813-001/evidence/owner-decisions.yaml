schema_version: "1.0"
assessment_id: "ASM-20260813-001"
recorded_at: "2026-08-13T22:57:22+08:00"
authority: "owner statements in the source Codex task; design direction only until implemented and verified"
decisions:
  - id: "OWNER-EG-001"
    subject: "Engineering Guardrails identity"
    decision: "Architecture Kit was renamed Engineering Guardrails and is the separately governed C:/Github/YuChia/dotnet-architecture-kit project; expected analyzer capability is continuous with the earlier design."
  - id: "OWNER-EG-002"
    subject: "recommended provider scope"
    decision: "Engineering Guardrails is the official recommended mechanical-validation provider only for the .NET technology block."
  - id: "OWNER-EG-003"
    subject: "selection semantics"
    decision: "Officially recommended does not mean default-selected. Installation remains explicit and optional."
  - id: "OWNER-EG-004"
    subject: "package-free fallback"
    decision: "A target that does not install Engineering Guardrails must still be able to create a target-owned analyzer from framework-provided analyzer source and test templates."
  - id: "OWNER-HYBRID-001"
    subject: "cross-platform identity and receipt authority"
    decision: "Use a hybrid model: raw artifact bytes remain authoritative; planner identity may use tracked Git canonical identity to avoid autocrlf-only conflicts without hiding dirty worktree changes; receipt binds raw SHA and Git mode; an extracted package carries sufficient selected-input proof for downstream verification; normalized text digests are diagnostic only."
  - id: "OWNER-TRACKING-001"
    subject: "next-version improvement intake"
    decision: "Retain the analyses and create deduplicated next-version improvement Issues. Project allocation, implementation, integration, and publication remain separate decisions."
  - id: "OWNER-UPGRADE-001"
    subject: "retained upgrade origins"
    decision: "Starting with v0.14.0, every subsequent framework release must support the immediate predecessor plus v0.6.0 and v0.9.0 as upgrade origins until the owner explicitly retires either retained origin."
  - id: "OWNER-UPGRADE-002"
    subject: "cross-version user experience"
    decision: "Support may use a validated direct migration or an automatically orchestrated multi-hop route, but the target owner must invoke one upgrade entrypoint and must not manually apply each intermediate framework release."

criteria:
- 'Issue319 AC1: verify 91-kind lifecycle inventory against explicit E01-E33 and implicit
  I01-I19 evidence; separate existing executable producers, semantic owners, external
  formats and 16 manual gaps. Callable source presence alone is not semantic coverage.'
- 'AC2: bounded catalog, skill, target and lifecycle operations retain fixed path/record
  authority and family field policy; candidate validations observe every material
  schema, runtime, owner, selected input, directory and Git partition. Inspect ViewPath
  link and glob behavior, source commit binding, wrapper projection and rollback.'
- 'AC3: migration disposition distinguishes historical input, current writer and admission.
  Only prior role 1.0 to 1.1 and external dispatch/completion 1.2 to 1.3 are conversions;
  no receipt, approval, provider, journal recovery or target facts are fabricated.'
- 'AC4: inspect actual p34-checks logs and input hashes. Preserve the extended-01
  9-pass/1-error attempt and the real material fix. Final catalog-03 21-case and routing-01
  7-case subset overlap; do not claim one full 22-case run. Authoring-02 36, contracts-01
  11, evaluation-01 18, shell-01 and canonical-02 retain their own identities. Execute
  the exact package-smoke command once with elevated fixture permissions, retain actual
  outcome and cleanup.'
- 'AC5: P4 removes only unrelated workflow/assessment calls for disjoint writer families;
  public validators, required gates and existing tests remain. Verify profile dependency
  closure, shell runner declarations, optional .NET profile availability and isolated
  portable evidence limits.'
- 'AC6: Chinese report and workflow must explain reasons, improvements, the precise
  scope relaxation, residual capability gaps and measured validation without inventing
  performance or hosted results. Owner authorizes local main integration; no remote/provider
  lifecycle actions.'

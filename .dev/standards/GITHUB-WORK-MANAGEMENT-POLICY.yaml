# Version 2 adopted by direct owner decision on 2026-10-02; see adoption record.
schema_version: '2.0'
policy_id: source-github-work-management
status: active
provider: github
repository: YuChia-Wei/ai-collaboration-framework
owner: YuChia-Wei
contract_role:
  active_policy: source work management after the explicit SOURCE-DEVELOPMENT-POLICY
    adoption; v1 legacy readers are not compatible
  authority_policy: .dev/standards/SOURCE-WORK-MANAGEMENT-AUTHORITY.md
  legacy_adapter: .dev/backlog/providers/github-legacy-migration.yaml
  historical_project_receipt: .dev/backlog/provider-mappings/github-project-current.yaml
authority:
  work_items: live GitHub Issues
  current_views: 'live GitHub Project #3'
  execution_evidence: .dev/workflows/
  integrated_truth: main
  provider_state_alone_authorizes: false
current_provider_state:
  mode: explicit-live-read-back-required
  credentials_for_ordinary_validation: false
  cached_snapshot_is_current_authority: false
  unavailable_provider_fallback: blocked; never use the frozen repository backlog
    or ROADMAP as current truth
project:
  number: 3
  title: AI Collaboration Framework — Backlog & Roadmap
  url: https://github.com/users/YuChia-Wei/projects/3
  live_fields:
  - Status
  - Priority
  - Owner review
  - Target release
  - Published in
issue:
  canonical_language: en
  comments_languages:
  - en
  - zh-TW
  creation_attribution:
    required_for_formal_issue: true
    label: created-by:codex
    marker_format: '<!-- created-by: {runtime} ({model}, {reasoning_effort}) <{email}>
      -->'
    runtime_binding: active Issue-creation execution
    refresh_policy: resolve execution values from the active runtime before each creation
work_item_binding:
  mode: required
  purposes:
  - traceability
  - work-authorization
  authorization:
    requires_explicit_owner_approval: true
    provider_state_alone_authorizes: false
    missing_binding: block material execution until an online GitHub Issue records
      the scope and explicit owner authorization
  merge_gate:
    mode: required
    disposition_required_per_issue: true
    missing_binding_blocks_merge: true
    review_gate:
      mode: maintainer-acceptance-with-conditional-independent-review
      maintainer_login: YuChia-Wei
      policy: .dev/standards/SOURCE-DEVELOPMENT-POLICY.md
      independent_for:
      - authority
      - security
      - credentials
      - publication
      - installation
      - recovery
      subject: immutable-diff-criteria-and-authority
      downstream_policy: target-owned
    required_check_contexts:
    - Source change gate
    required_check_paths:
    - src/**
    - tools/**
    outside_check_paths: not-applicable
issue_closure:
  policy: .dev/standards/GITHUB-TERMINAL-ISSUE-CLOSURE-POLICY.md
  distribution: source-repository-only
  modes:
  - terminal-close
  - deferred
  approved_closing_keywords:
  - Closes
  - Fixes
  - Resolves
  deferred_reference_keyword: Refs
  mixed_per_issue_dispositions: true
  closing_keyword_authorizes_work: false
  integration_topologies:
  - fast-forward
  - rebase
  - squash
  - merge-commit
  post_merge_source_mutation_required: false
  terminal_requires:
  - final-accepted-delivery
  - complete-scope-and-applicable-verification
  - source-review-and-current-head-hosted-checks
  - actual-integration-read-back
  - matching-closing-keyword-or-explicit-post-merge-owner-closure
  - separate-issue-and-project-read-back
  deferred_requires:
  - Refs
  - no-closing-keyword-for-that-issue
  - closure_deferred_reason
  - next-terminal-gate-or-owner
  nonterminal_on:
  - hosted-failed
  - hosted-cancelled
  - hosted-timed-out
  - head-drift
  - review-block
  - missing-or-mismatched-read-back
proposal_intake:
  form: .github/ISSUE_TEMPLATE/proposal.yml
  blank_issues_enabled: false
  initial_project_status: Inbox
  initial_label: kind:proposal
  promotion_creates_new_formal_issue: true
  ai_may_triage: true
  ai_may_accept_or_reject: false

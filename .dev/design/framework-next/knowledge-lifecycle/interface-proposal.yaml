execution_status: design-only
verification: deferred-by-owner
verification_owner: program-322-coordinator/P7
shared_decisions:
  - id: C334-01
    subject: project-config-envelope
    recommended: config_version 2; validate only selected namespace; foreign namespaces opaque objects
    retained: Lesson reads unchanged closed config_version 1; no implicit conversion
    reconcile_with: Issue 335
  - id: C334-02
    subject: metadata-readable-schema-versions
    recommended: metadata_version 2; schemas keyed by id+version; project artifact role adds read_schemas
    write_selection: existing schema field names the only writable version
    retained: version 1 loader; reject duplicate schema pairs and cross-kind resource ID collisions
    coordinator_files:
      - src/distribution/package.py
      - src/distribution/manifest.yaml
      - src/profiles/
    constraint: No helper/member field, global registry or automatic version negotiation
  - id: C334-03
    subject: promotion-owner
    recommended: standards-promotion, independently selectable
    mechanism: persist one-file replacement proposal; later read actual owner adoption, rule bytes and effect evidence
    constraint: no apply operation; project-only evidence adapters; no arbitrary governance write
  - id: C334-04
    subject: implementation-ownership
    recommended: resume same task after explicit source-root handoff
    executor_roots:
      - src/skills/lesson/
      - src/skills/adr/
      - src/skills/standards-promotion/
    coordinator_owns:
      - shared configuration and metadata contracts
      - src/distribution/
      - src/profiles/
      - runtime projections and root entries
      - .dev/workflows/INDEX.MD
      - .dev/workflows/2026-09-23-framework-redesign-control/

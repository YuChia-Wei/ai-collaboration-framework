runtime:
  inherited_requirements: [skill-instruction-reader, python, pyyaml, jsonschema, filesystem]
  new_shared_runtime: false
  package_calls: none
  record_schema_refs: same-document-only
  metadata_schema_identity: exact-id-and-version
version_dispositions:
  lesson_v1: preserve bytes; read only; explicit derive to new identity; no migration edge
  unknown_record: preserve and report unsupported; partial query
  project_config_v1: Lesson compatibility only; owner edits to v2 are explicit
  metadata_v1: retain reader; reject unsupported v2 without mutation
  history: no bulk conversion

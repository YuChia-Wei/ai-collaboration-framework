authority: Owner authorized implementation, package installation and validation on 2026-10-11, adopting the previous SQLite design and Python prerequisites. All downstream package members and runtime dependencies must originate in src; tools is source-project tooling only. Dolt remains a future candidate.
execution: Parent is the sole tracked writer and integration owner. A bounded package writer uses a separate managed worktree; read-only advisors inspect SQLite and acceptance. Independent immutable review is required for installation and recovery. Synthetic isolated consumers only; no real-data migration or publication.
workflow_rationale: Preserve coordinated provider, package, actual installed acceptance and independent review across stages. Source implementation, installed behavior, integration and release remain separate.

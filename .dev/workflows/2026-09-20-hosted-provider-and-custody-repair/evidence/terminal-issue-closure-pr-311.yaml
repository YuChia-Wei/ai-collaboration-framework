    ## Summary

    - Make GitHub CLI's opaque hosted `unknown owner type` Project failure actionable without exposing or changing provider credentials.
    - Replace the external-task completion self-validation cycle with an exact-byte candidate, independent receipt, and custody-bound terminal delivery.
    - Harden receipt custody after independent audit and targeted sweep: candidates reject self-asserted validation; strict duplicate-free raw bytes must match their validated mappings; verification and writing use canonical custody paths; contract integers reject YAML booleans and equality-equivalent floats; dispatch task kind, receipt-writer CLI modes, dispatch-selected delivery transport, and dispatch/receipt representations are fail-closed; output creation is exclusive; execution-packet validator invocation is canonical; and Windows alternate-data-stream paths are rejected.

    ## Validation

    - #309: `py -3 .ai/scripts/tests/test_release_provider_reconciliation.py` — 12 focused tests passed in the permitted local disposable-fixture environment. The original hosted failure remains preserved.

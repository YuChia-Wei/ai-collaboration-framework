  head_sha: null
  body: 'This release places private role resources beside their owning skills, generates
    direct runtime entries for review and local implementation, and uses proportionate
    evidence for routine collaboration. It adds shared inbox/outbox guidance while
    preserving target-owned technology, transaction and validation decisions.


    The upgrade fixes archive finalized pending receipts before clone and verify restored
    rollback snapshots on Windows. Retained native Candidate10 execution covers all
    nine v0.6.0, v0.9.0 and v0.17.0 cases. Candidate11 admission proves exactly two
    bounded payload repairs and preserves that original execution identity; it does
    not claim a repeated nine-case run. The earlier lab candidate passed 55 target
    tests and independent verification; Candidate11 requires its own target receipt
    and audit before downstream adoption. Terra/Luna trials demonstrate rule consumption
    with retained answer-quality and measurement limits; they do not establish billing
    savings.


    Release admission separately requires the release profile, fresh lifecycle-sensitive
    checks, independent source review, hosted contexts and live provider read-back.
    The tracked declaration records delivery intent; publication and downstream adoption
    have their own acceptance evidence.


    Merge-commit topology preserves this release, migration and cross-runtime change
    as one review and rollback unit.


    Closes #300

    Closes #301

    Closes #303

    Closes #304

    Refs #302

    '

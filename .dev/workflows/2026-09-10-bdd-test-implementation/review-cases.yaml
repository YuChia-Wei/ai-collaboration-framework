- id: REVIEW-05
  profile: Explicit PlainXunit BDDfy opt-out
  contract: Only February 2021 has budget 28. Query January 1 through January 2. Amount must equal 0. Fixture constructor
    creates a new real BudgetQuery and a new NSubstitute repository per test.
  code: "private decimal _actual;\n[Fact]\npublic void Should_return_zero_when_no_budget_matches()\n{\n    GivenMonthlyBudget(\"\
    202102\", 28m);\n    WhenQueryingBudget();\n    ThenAmountShouldBe(0m);\n}\nprivate void GivenMonthlyBudget(string\
    \ month, decimal amount) =>\n    _repository.GetAllAsync(Arg.Any<CancellationToken>()).Returns(Task.FromResult<IReadOnlyList<MonthlyBudget>>(new[]\
    \ {new MonthlyBudget(month, amount)}));\nprivate void WhenQueryingBudget() { _ = QueryLater(); }\nprivate async Task\
    \ QueryLater() => _actual = await _subject.QueryAsync(new DateOnly(2021, 1, 1), new DateOnly(2021, 1, 2));\nprivate\
    \ void ThenAmountShouldBe(decimal expected) => Assert.Equal(expected, _actual);\n"
- id: REVIEW-06
  profile: Explicit PlainXunit BDDfy opt-out
  contract: Inverted range must throw exact ArgumentException with ParamName=end, before any repository read. The real
    subject and substitute are fresh.
  code: "[Fact]\npublic async Task Should_reject_an_inverted_range()\n{\n    GivenMonthlyBudget(\"202104\", 300m);\n\
    \    var error = await WhenQueryingAnInvalidRange();\n    ThenTheRangeShouldBeRejected(error);\n}\nprivate void GivenMonthlyBudget(string\
    \ month, decimal amount) => _repository.GetAllAsync(Arg.Any<CancellationToken>()).Returns(Task.FromResult<IReadOnlyList<MonthlyBudget>>(new[]\
    \ {new MonthlyBudget(month, amount)}));\nprivate async Task<Exception?> WhenQueryingAnInvalidRange() => await Record.ExceptionAsync(()\
    \ => _subject.QueryAsync(new DateOnly(2021, 4, 2), new DateOnly(2021, 4, 1)));\nprivate static void ThenTheRangeShouldBeRejected(Exception?\
    \ error) => Assert.IsType<ArgumentException>(error);\n"
- id: REVIEW-07
  profile: Explicit PlainXunit BDDfy opt-out
  contract: A new test instance uses a real AmountGuard. Its contract rejects negative amounts with exact ArgumentOutOfRangeException
    and ParamName=amount. This is the canonical compact exception-contract form permitted by section 5.
  code: "[Fact]\npublic void Should_reject_negative_amount()\n{\n    // Given\n    var subject = new AmountGuard();\n\
    \    // When / Then\n    var error = Assert.Throws<ArgumentOutOfRangeException>(() => subject.Accept(-1m));\n   \
    \ Assert.Equal(\"amount\", error.ParamName);\n}\n"

authority: Owner approved design and development based on current workflows for compatibility with past records on 2026-10-10, following the inventory and first Git slice proposal. Use F RAM disk for high-IO work if needed.
execution: Parent is the only tracked writer and integration owner. Bounded workers provide read-only inventory and design advice. Local design, implementation, tests, commits and scoped independent review are selected. Provider writes, push, PR, merge, publication, managed installation and data migration are not selected.
workflow_rationale: Preserve the selected contract, compatibility boundaries, implementation and immutable independent review across stages. A source-only CLI delivery is distinct from future package distribution and downstream adoption.

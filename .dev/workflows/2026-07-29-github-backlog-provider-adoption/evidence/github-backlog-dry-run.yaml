    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Release the Work-Management Lifecycle as a v0.7.0 Scope Candidate**

      - Benefit: Classify the completed PR #10 work-management lifecycle policy for portable v0.7.0 distribution, preserving source-repository GitHub choices as local policy rather than silently exporting them as target defaults.


      ## Outcome


      Classify the completed PR #10 work-management lifecycle policy for portable v0.7.0 distribution, preserving source-repository GitHub choices as local policy rather than silently exporting them as target defaults.


      ## Acceptance Criteria


      - Every policy file changed by PR #10 has an explicit v0.7.0 disposition: portable framework contract, source-only exclusion, or target-owned customization boundary.

      - GitHub Issues, GitHub Projects, and pull-request-only integration remain source-repository choices unless a portable target contract is explicitly approved.

      - The released framework distinguishes conversation, candidate work, authorized execution, and integrated repository facts without requiring one tracker provider.

      - The release-facing guidance explains how a target with another tracker or integration policy preserves and reconciles its own rule.

      - The selected release payload and migration behavior are validated before GOV-002 is resolved.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: The work-management policy separates source-local provider rules from portable lifecycle semantics.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Before a v0.7.0 package candidate is built, create a dedicated implementation workflow that classifies every PR #10 policy surface as portable framework truth, source-only local policy, or an explicit target customization; do not infer portability from its current path.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.7.0`


  issue:
    title: '[REL-003] Fail-Closed Canonical Included Work Traceability'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Fail-Closed Canonical Included Work Traceability**

      - Benefit: Require every v0.7.0-or-later candidate to match its resolved completed backlog set exactly and render each Included Work ID once without overwriting authored release notes.


      ## Outcome


      Require every v0.7.0-or-later candidate to match its resolved completed backlog set exactly and render each Included Work ID once without overwriting authored release notes.


      ## Acceptance Criteria


      - Candidate membership is derived from every resolved backlog item whose release.completed_in equals the candidate version.

      - release.yaml.planning.backlog_refs matches the canonical set exactly, with no missing, duplicate, unrelated, unresolved, completion-mismatched, or prematurely published item.

      - The renderer preserves all authored release-note content and appends one generated Included Work entry per canonical backlog ID.

      - The prospective contract begins with v0.7.0 and does not rewrite historical release notes.

      - Positive and negative release-state, backlog, and renderer fixtures pass.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope



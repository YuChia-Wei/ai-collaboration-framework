    title: '[PKG-004] Block Unclassified Work-Management Policy from v0.7.0 Packages'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Block Unclassified Work-Management Policy from v0.7.0 Packages**

      - Benefit: Produce a v0.7.0 package-selection proof that prevents source-repository-only work-management policy and execution history from being shipped as downstream framework truth.


      ## Outcome


      Produce a v0.7.0 package-selection proof that prevents source-repository-only work-management policy and execution history from being shipped as downstream framework truth.


      ## Acceptance Criteria


      - A candidate payload manifest and diff identify every PR #10 policy file that would enter the selected package.

      - Dated workflow, assessment, roadmap, and source-project records remain excluded from downstream payloads.

      - No source-repository GitHub provider choice or main-branch transport rule is represented as an unconditional downstream requirement.

      - The selected package passes deterministic package validation and the applicable clean-install or upgrade fixture before release publication.

      - Release notes and migration guidance state any target reconciliation required by the portable work-management contract.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source packaging must prevent source-local work-management policy from leaking downstream.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: After GOV-002 supplies the approved policy disposition, execute package planning and clean-install or upgrade validation against the selected v0.7.0 candidate commit. Do not create a tag or hosted release until the payload proof passes.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.7.0`

      - Completed in: `v0.7.0`

      - Published in: `v0.7.0`

      - Original created at: `2026-07-27T21:39:33+08:00`

      - Original updated at: `2026-07-28T21:31:43+08:00`

      - Owner decision: Resolved: the deterministic payload includes only the approved portable work-management projection, excludes source history and source-local policy, and passes applicable package, clean-install, and initialized-upgrade evidence.


      ## Delivery Evidence


      - Implemented: [PR #10](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/pull/10)


      - Evidence classification: `exact-pr`



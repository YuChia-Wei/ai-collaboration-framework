  issue:
    title: '[PKG-003] Govern Multi-Source Direct Package Upgrades'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **Govern Multi-Source Direct Package Upgrades**,


      so that introduce a governed migration contract that can publish and select deterministic operations for multiple supported source versions instead of binding one release to one previous files manifest.


      ## Outcome


      Introduce a governed migration contract that can publish and select deterministic operations for multiple supported source versions instead of binding one release to one previous files manifest.


      ## Acceptance Criteria


      - One release can declare multiple governed automatic upgrade sources without ambiguous manifest identity or operation selection.

      - Each supported source binds an exact immutable files manifest and deterministic operation set.

      - Real extracted-package upgrades pass from v0.3.0, v0.4.0, v0.4.1, and v0.4.2 to the v0.5.0 candidate.

      - A project whose earliest provenance is v0.0.1 has a documented executable path through v0.3.0 and then either directly to v0.5.0 or through an explicitly required intermediate.

      - The retained dotnet-mq-arch-lab v0.4.0 target upgrades directly to v0.5.0 with target-owned truth and local overrides preserved.

      - Clean-install behavior remains supported and independently validated.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Downstream adopters need governed direct upgrades from supported source versions.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: After v0.4.2 closes, create a dedicated v0.5.0 workflow and obtain explicit SemVer/schema approval before implementing the multi-source public migration contract.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.5.0`

      - Completed in: `v0.5.0`

      - Published in: `v0.5.0`

      - Original created at: `2026-07-18T22:58:51+08:00`

      - Original updated at: `2026-07-22T21:13:53+08:00`

      - Owner decision: Completed and published after the owner''s 2026-07-22 amendment: v0.4.2 joins v0.3.0, v0.4.0, and v0.4.1 as an exact automatic v0.5.0 source. The four-source extracted-package fixture and complete 33/33 source critical gate passed under V050-009, and REL-v0.5.0 now publishes the contract.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-21-v0-5-0-development/evidence/v050-pkg003-v042-expansion.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-21-v0-5-0-development/evidence/v050-pkg003-v042-expansion.md)


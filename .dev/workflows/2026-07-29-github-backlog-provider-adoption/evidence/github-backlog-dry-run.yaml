  issue:
    title: '[PKG-002] Separate Source-Only Tests From Downstream Package Gates'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Separate Source-Only Tests From Downstream Package Gates**

      - Benefit: Prevent packaged documentation and required gates from selecting source-release tests whose tags, release registry, or package-builder module are absent downstream.


      ## Outcome


      Prevent packaged documentation and required gates from selecting source-release tests whose tags, release registry, or package-builder module are absent downstream.


      ## Acceptance Criteria


      - Every packaged required check can execute using only package contents, target repository truth, and documented target dependencies.

      - Source-release governance and package-builder tests are either excluded from the downstream profile or explicitly classified and skipped outside the source repository.

      - The packaged scripts README distinguishes source-only tests from downstream-supported validation commands.

      - An extracted-package smoke test runs the downstream required gate without missing Git refs, release records, or Python modules.

      - Source-repository release and package-builder coverage remains required in the source gate.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source-only tests and downstream package gates require an explicit separation.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Implement after PKG-001 within the active v0.4.1 remediation workflow and before general content corrections.



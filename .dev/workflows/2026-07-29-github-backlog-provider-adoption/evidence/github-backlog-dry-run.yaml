  issue:
    title: '[SKILL-001] AI Context And Development Orchestrator Skill Transitions'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **AI Context And Development Orchestrator Skill Transitions**,


      so that introduce explicit AI-context and software-development skill families, transition repo-structure-sync to ai-context-init, and transition dev-workflow to an owner-approved development-orchestrator name through coordinated deprecated compatibility entries.


      ## Outcome


      Introduce explicit AI-context and software-development skill families, transition repo-structure-sync to ai-context-init, and transition dev-workflow to an owner-approved development-orchestrator name through coordinated deprecated compatibility entries.


      ## Acceptance Criteria


      - No acceptance criteria were recorded in the canonical backlog item; follow the linked source and workflow evidence without inventing criteria.


      ## Boundaries


      - v0.6.0 introduces ai-context-init as the active name and retains repo-structure-sync as a thin deprecated compatibility entry.

      - v0.6.0 introduces software-development-orchestrator as the active name and retains dev-workflow as a thin deprecated compatibility entry in the same compatibility batch.

      - Historical initialized_by, generatedBy, workflow, assessment, and release provenance remains unchanged.

      - Historical owner_skill, task, workflow, assessment, and release identifiers remain unchanged.

      - Removal of either legacy identifier is conditional on downstream migration evidence and is not pre-committed to v0.7.0.

      - Both transitions share one taxonomy, wrapper, distribution, migration, validator, and evaluation campaign without implying that the two skills have the same lifecycle responsibility.

      - software-development-orchestrator ends at an approved development closeout or PR-ready handoff; production delivery, maintenance-window, deployment-approval, production-verification, and rollback orchestration remain outside its current scope.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Framework users need stable skill identities and compatible orchestration transitions.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: After v0.5.0 governance contracts stabilize, create a dedicated workflow that defines deprecation metadata and validation before changing canonical identifiers, wrappers, paths, distribution, or provenance behavior.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `MEDIUM` → `P2 Normal`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`

      - Original created at: `2026-07-18T14:53:16+08:00`

      - Original updated at: `2026-07-24T15:15:15+08:00`

      - Owner decision: Resolved: after the owner-selected Terra evaluation passed 8/8 critical and 8/8 full outcomes, both v0.6.0 identifiers activated atomically with thin deprecated aliases, immutable historical identities, and no scheduled removal release.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-24-v0-6-config-skill-transition/reports/skill-transition-report.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-24-v0-6-config-skill-transition/reports/skill-transition-report.md)


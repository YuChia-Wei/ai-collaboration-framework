  issue:
    title: '[CUST-001] Define Semantic AI Context Customization Ledger'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **Define Semantic AI Context Customization Ledger**,


      so that introduce one target-owned semantic customization ledger beside provenance so governance, auditor, and upgrader can reconcile capability, rule, and contract customizations without treating path differences as sufficient meaning.


      ## Outcome


      Introduce one target-owned semantic customization ledger beside provenance so governance, auditor, and upgrader can reconcile capability, rule, and contract customizations without treating path differences as sufficient meaning.


      ## Acceptance Criteria


      - The v0.6.0 target-owned source of truth is one .dev/ai-context/customizations.yaml file referenced by .dev/ai-context/provenance.yaml.

      - Every entry has a stable ID and identifies the affected capability, rule, or contract before listing paths as supporting evidence.

      - Every entry records semantic relationship, owner, reason, dependencies, base framework evidence, and requirement, ADR, or workflow decision evidence when applicable.

      - Target-owned requirements, ADRs, runbooks, maintenance windows, test commands, enterprise network rules, and permission policies are not classified as framework customizations merely because they are absent upstream.

      - A target-owned policy is recorded in the ledger only when it extends, replaces, or deviates from framework-managed behavior; the raw target policy remains target-owned truth.

      - Governance records authorized customizations, auditor verifies active-context correspondence, upgrader performs Base/Incoming/Target plus semantic-equivalence analysis, governance records reconciliation, and auditor verifies the post-upgrade state.

      - Incoming official behavior is classified as absent, partial, equivalent-candidate, or conflicting; equivalence never silently grants retirement authority.

      - Retain, merge, supersede, retire, and unresolved dispositions require explicit evidence and owner authority; upgrader updates provenance only after target validation succeeds.

      - Legacy targets without reliable provenance or customization records enter unresolved manual inventory rather than automatic overwrite.

      - Schema, migration, validators, package projection, examples, and downstream upgrade fixtures are updated together.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Downstream adopters need target-owned customizations preserved across framework lifecycle changes.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Implement with DIST-001 provenance and migration design. Do not infer semantic customization solely from changed bytes, and do not retire a target customization without explicit owner reconciliation.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`

      - Original created at: `2026-07-24T00:31:35+08:00`

      - Original updated at: `2026-07-24T15:15:15+08:00`

      - Owner decision: Owner decision recorded on 2026-07-24: use one .dev/ai-context/customizations.yaml ledger; identify entries primarily by capability, rule, or contract; retain requirement, ADR, and workflow evidence; keep enterprise test and permission policy as target-owned truth unless it changes framework behavior.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-23-v0-6-product-contract-planning/reports/remediation-report.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-23-v0-6-product-contract-planning/reports/remediation-report.md)


  classification:
    kind: story
    scope: framework
    rationale: Existing AI-agent repositories need safe, collision-aware framework adoption.
  issue:
    title: '[INIT-001] Existing AI Agent Repository Compatibility Intake'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **Existing AI Agent Repository Compatibility Intake**,


      so that evaluate how ai-context-init can safely adopt this framework in an existing repository that already has AI agent instructions, wrappers, and runtime configuration.


      ## Outcome


      Evaluate how ai-context-init can safely adopt this framework in an existing repository that already has AI agent instructions, wrappers, and runtime configuration.


      ## Acceptance Criteria


      - The intake inventories existing AI-agent surfaces before copying, rewriting, or deleting any target context.

      - Every collision is classified as preserve, compatible, merge-required, owner-decision, or excluded-sensitive with file-backed evidence.

      - Existing target instructions and runtime configuration remain target-owned unless an explicit owner decision authorizes replacement or semantic reconciliation.

      - A dry-run reports proposed additions, preserved files, semantic merges, unresolved conflicts, and excluded sensitive paths before any write.

      - Unknown framework source evidence permits inventory and an unresolved result but does not create provenance.yaml or customizations.yaml.

      - Synthetic fixtures cover at least AGENTS-only, Claude Code, GitHub Copilot, and mixed-provider repositories, including one intentional instruction conflict.

      - Fixtures contain no credentials, tokens, personal permissions, machine-local secrets, or copied private session content.

      - Deterministic validation proves that target-owned files are byte-preserved until their explicit disposition is authorized.

      - A future real-repository pilot records practical feedback and residual gaps but is not required to retain this low-priority candidate or design its initial contract.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Existing AI-agent repositories need safe, collision-aware framework adoption.

      - Recommended owner skill: `ai-context-init`

      - Handoff condition: Activate a dedicated ai-context-init compatibility workflow only after the owner selects the collision taxonomy and dry-run boundary. Synthetic fixtures may establish the contract before a real target becomes available; a real pilot remains later maturity evidence.


      ## Lifecycle


      - Canonical state: `open`

      - Priority: `LOW` → `P3 Low`

      - Target release: `Unassigned`

      - Completed in: `Not completed`

      - Published in: `Not yet published`

      - Original created at: `2026-07-27T21:04:52+08:00`

      - Original updated at: `2026-07-27T21:04:52+08:00`

      - Owner decision: Define authority, precedence, collision classification, dry-run output, and owner-approval rules for existing AGENTS.md, CLAUDE.md, Copilot instructions, runtime wrappers, hooks, MCP declarations, and other target-owned AI context before implementation.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-27-backlog-init-compatibility-intake/workflow.yaml](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-27-backlog-init-compatibility-intake/workflow.yaml)


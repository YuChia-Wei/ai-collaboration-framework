  issue:
    title: '[DEVWF-002] Establish Software Development End-To-End Acceptance'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **Establish Software Development End-To-End Acceptance**,


      so that prove that the software-development core activates from high-level intent, routes stages through capabilities without requiring skill names, respects approval pauses, records validated stage commits at sustainable density, executes target-selected tests, and closes without false success.


      ## Outcome


      Prove that the software-development core activates from high-level intent, routes stages through capabilities without requiring skill names, respects approval pauses, records validated stage commits at sustainable density, executes target-selected tests, and closes without false success.


      ## Acceptance Criteria


      - A high-level multi-stage software-development request activates the orchestrator without requiring the user to name dev-workflow, software-development-orchestrator, or downstream skills.

      - The orchestrator maps intent to capability slots and resolves the active profile or discovery contract with recorded confidence; it does not infer stages from skill names alone.

      - A long requirement, design, or specification discussion pauses for approval and does not create or execute implementation work before authorization.

      - Each approved, durable, and validated stage or coherent bounded batch has a commit checkpoint under the existing Git commit policy; repeated calls to one skill do not create mechanical per-invocation commits.

      - Small tasks completed and validated together may share one commit, and any history compression is limited to unshared, unpushed commits without destroying approval, review, handoff, or evidence boundaries.

      - The test-execution capability resolves target-owned commands, working directory, prerequisites, and policy without inventing credentials, bypassing enterprise controls, or escalating privileges implicitly.

      - Unit and integration tests are the default development levels; blocked-by-environment is recorded as blocked and never counted as passed.

      - E2E, browser, Playwright, deployment-dependent, and other specialized tests are conditional capabilities; if requirements or target policy make one mandatory, closeout pauses until it has a valid outcome.

      - No dedicated test-execution skill is required for v0.6.0; a target profile may use repository commands, a fallback contract, or a separately evaluated external skill.

      - Spec compliance is selectable. Without explicit activation it is not applicable; after activation, partial configuration or less than 100 percent coverage fails closed.

      - Closeout checks approved requirements and specs, implementation completion, required test outcomes, selected compliance gates, review disposition, validation evidence, task state, and commit evidence separately.

      - A fresh session can resume from Git, workflow artifacts, target policy, and recorded test state without hidden conversation context.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Framework users need one governed end-to-end development orchestration contract.

      - Recommended owner skill: `dev-workflow`

      - Handoff condition: Implement with the SKILL-001 compatibility transition to software-development-orchestrator. Define test-execution as a pluggable capability contract first; do not create a new test skill until real team adoption or an evaluated external skill justifies it.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`

      - Original created at: `2026-07-24T00:31:35+08:00`

      - Original updated at: `2026-07-24T15:15:15+08:00`

      - Owner decision: Owner decision recorded on 2026-07-24: retain the existing Git commit policy with stage-level commit batching; define target-aware unit and integration test execution without introducing a new skill yet; keep E2E conditional; make spec compliance selectable and fail-closed only after explicit activation.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-23-v0-6-product-contract-planning/reports/remediation-report.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-23-v0-6-product-contract-planning/reports/remediation-report.md)


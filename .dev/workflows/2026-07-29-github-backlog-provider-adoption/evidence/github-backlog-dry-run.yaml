  issue:
    title: '[CI-002] Review GitHub Workflow Trigger And Lifecycle Boundaries'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Review GitHub Workflow Trigger And Lifecycle Boundaries**

      - Benefit: Review every GitHub workflow for path scope, responsibility, release-phase ownership, duplication, concurrency, and post-publication behavior.


      ## Outcome


      Review every GitHub workflow for path scope, responsibility, release-phase ownership, duplication, concurrency, and post-publication behavior.


      ## Acceptance Criteria


      - Inventory every active workflow trigger, path filter, manual dispatch, permission, concurrency rule, job responsibility, and mutation boundary.

      - Classify each executable check as general governance, portable validation, candidate build, tag validation, publication, or finalization.

      - No general governance path may invoke a hardcoded release phase merely because an unrelated backlog, guide, standard, or workflow record changed.

      - Candidate, tag, publication, and finalization checks run only in workflows that own those lifecycle events or under an explicit changed-path condition.

      - The review identifies duplicate gates, missing gates, stale version literals, post-publication behavior, skipped-check risks, and expected runner cost.

      - PR updates use bounded concurrency or retain an explicit reason not to cancel superseded runs.

      - Workflow contract tests enforce the accepted trigger and ownership matrix and fail on phase-specific regression.

      - The review reconciles CI-001 Node.js 24 action migration so related workflow edits are not duplicated.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Hosted workflow lifecycle governs source operations and published release outcomes.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Open a dedicated workflow review before the next release candidate or combine it explicitly with CI-001. Preserve the PR #6 short-term repair as a tested boundary, not the complete review.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.6.0`


  issue:
    title: '[REL-002] Portable Pre-Tag Critical-Gate Output'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Portable Pre-Tag Critical-Gate Output**

      - Benefit: Make the sanctioned pre-tag runner select Git Bash rather than the Windows WSL launcher and decode arbitrary output deterministically, without weakening its exact command allowlist or fail-closed behavior.


      ## Outcome


      Make the sanctioned pre-tag runner select Git Bash rather than the Windows WSL launcher and decode arbitrary output deterministically, without weakening its exact command allowlist or fail-closed behavior.


      ## Acceptance Criteria


      - The runner consumes subprocess output as bytes and decodes it deterministically without a background reader-thread exception.

      - Windows resolves the Git Bash executable from the active Git installation or standard installation roots without falling through to the WSL bash launcher.

      - The child-process environment prepends the selected Git installation''s usr/bin only for the gate invocation, without mutating the parent environment.

      - Invalid UTF-8 bytes are represented safely while retaining surrounding diagnostic output.

      - When both streams contain output, the failure retains the gate summary from stdout and detailed diagnostics from stderr.

      - A failed command with empty or unavailable output produces a deterministic exit-code error instead of an attribute error.

      - The exact critical-gate command allowlist remains unchanged.

      - Focused regressions, the critical gate, and required hosted workflows pass.

      - The sanctioned v0.5.0 pre-tag command passes on merged main without creating a tag.

      - Any later main merge expires every previously printed tag command; the operator must rerun pre-tag on current clean main and use only the newly printed command.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source pre-tag gates protect portable release behavior across hosts.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Repair and merge the bounded output-decoding defect, prove the sanctioned command on updated main, then close through a dedicated continuation branch.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH / P0` → `P0 Critical`

      - Target release: `v0.5.0`

      - Completed in: `v0.5.0`

      - Published in: `v0.5.0`

      - Original created at: `2026-07-22T08:46:21+08:00`

      - Original updated at: `2026-07-22T21:13:53+08:00`

      - Owner decision: Resolved: PR #2 merged as 540cd029; the sanctioned pre-tag command passed on that clean main commit and printed, but did not execute, the separately owner-authorized tag command.


      ## Delivery Evidence


      - Implemented: [PR #2](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/pull/2)


      - Evidence classification: `exact-pr`


      ## Related Work


      - No explicit parent, sub-issue, or related backlog relationship is recorded.



      - AI-context path changes run the approved governance validation route in pull-request CI.

      - Every obsolete published template or script has an explicit retain, deprecate, relocate, or remove disposition.

      - Relocation or removal includes migration guidance, compatibility impact review, and downstream evidence.

      - Policy, distribution manifests, indexes, validators, and release evidence agree on the resulting paths and required gates.



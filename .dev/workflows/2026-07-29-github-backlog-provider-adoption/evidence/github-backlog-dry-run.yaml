  issue:
    title: '[CI-001] Migrate Artifact Actions To Native Node.js 24 Runtimes'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Migrate Artifact Actions To Native Node.js 24 Runtimes**

      - Benefit: Replace Node.js 20 artifact-action majors in candidate and publication workflows before GitHub removes the compatibility runtime.


      ## Outcome


      Replace Node.js 20 artifact-action majors in candidate and publication workflows before GitHub removes the compatibility runtime.


      ## Acceptance Criteria


      - Every active candidate and publication workflow uses Node.js 24-native artifact actions; no active call remains on actions/upload-artifact@v4 or actions/download-artifact@v5.

      - The selected action releases are verified from their official repositories at implementation time; the current expected majors are upload-artifact v7 and download-artifact v8.

      - Hosted runner compatibility passes, and any supported self-hosted runner requirement such as 2.327.1 is documented before activation.

      - Candidate artifact names, retention, compression level, missing-file behavior, and release-body transfer remain unchanged unless separately approved.

      - Publication still downloads only the artifact produced by the validated tag job and re-verifies the tag, sidecars, inventories, checksums, and archive parity before release mutation.

      - A pull-request candidate run and a non-production publication-path fixture or authorized release rehearsal complete without Node.js 20 deprecation annotations.

      - Workflow contract tests fail closed if an active action regresses to a deprecated runtime major.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`


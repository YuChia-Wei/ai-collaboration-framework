  issue:
    title: '[SAG-001] Sub-Agent Runtime Adapter Promotion And Parity Contract'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **Sub-Agent Runtime Adapter Promotion And Parity Contract**,


      so that define when a canonical delegated role remains dynamically loaded versus receiving runtime-native adapters, close context-translator discovery drift, and validate declared adapter parity without bulk-generating wrappers.


      ## Outcome


      Define when a canonical delegated role remains dynamically loaded versus receiving runtime-native adapters, close context-translator discovery drift, and validate declared adapter parity without bulk-generating wrappers.


      ## Acceptance Criteria


      - Document dynamic canonical loading as the default and runtime-native promotion as an evidence-backed exception.

      - Add a sub-agent adapter metadata contract with exact target-to-path parity for codex, claude, and copilot.

      - Extend deterministic validation and GWT fixtures to reject missing, extra, duplicate, escaping, placeholder, and nonexistent adapter paths.

      - Validate that every declared runtime-native adapter imports or cites its canonical sub-agent role and that package profiles include the adapter path.

      - Add context-translator to active routing and align human-facing taxonomy and usage references without duplicating canonical rules.

      - Inventory all 18 roles and record an explicit keep-dynamic or promote-native disposition; do not generate adapters solely for symmetry.

      - Verify then-current runtime schemas and actual client availability before claiming that an adapter is executable.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Framework users need supported runtime adapters with parity across providers.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Use v0.4.2 only for the existing context-translator routing/catalog correction; after v0.4.2 closes, open a dedicated v0.5.0 workflow for schema, validator, packaging, and selective promotion decisions.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `MEDIUM` → `P2 Normal`

      - Target release: `v0.5.0`

      - Completed in: `v0.5.0`

      - Published in: `v0.5.0`

      - Original created at: `2026-07-18T20:15:59+08:00`

      - Original updated at: `2026-07-22T21:13:53+08:00`

      - Owner decision: Resolved: dynamic loading is the default for 17 roles; only context-translator has evidence-backed native adapters for Codex, Claude, and Copilot.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-21-v0-5-0-development/evidence/v050-sag001-runtime-contract.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-21-v0-5-0-development/evidence/v050-sag001-runtime-contract.md)


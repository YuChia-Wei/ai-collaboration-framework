  issue:
    title: '[REL-004] Evaluate Source-Only AI Context Release Closeout'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Evaluate Source-Only AI Context Release Closeout**

      - Benefit: Evaluate a repository-only AI context release closeout capability that shortens post-tag registry finalization while preserving strict separation from the published framework product.


      ## Outcome


      Evaluate a repository-only AI context release closeout capability that shortens post-tag registry finalization while preserving strict separation from the published framework product.


      ## Acceptance Criteria


      - The final name preserves the ai-context namespace and clearly means post-publication administrative closeout rather than candidate preparation, tag creation, or hosted publication.

      - The capability has no runtime dependency on another skill; portable ai-context-governance does not reference, route to, or require the repo-only skill.

      - Canonical instructions, runtime wrappers, scripts, tests, registries, and routing are explicitly classified as source-only or otherwise proven absent from every published package component.

      - A deterministic package regression fails if any closeout skill path, identifier, or broken reference leaks into the published payload.

      - The skill remains a thin low-freedom entry that performs only post-tag verification, registry reconciliation, the declared validation bundle, and the repository Git handoff.

      - Python and uv availability is checked before repository writes; when neither sanctioned runtime is available, the operation returns blocked-by-environment without manual mutation or a false completion claim.

      - Failure containment keeps the primary worktree unchanged until an isolated temporary worktree produces a validated patch, and shared or published history is never automatically rewritten.

      - A forward test measures local closeout effort and confirms that candidate discovery, broad governance re-reading, unrelated remediation, and duplicate validation are not reintroduced.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `source-repo`

      - Classification evidence: The proposed closeout capability is explicitly limited to this repository''s release finalization.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Open a dedicated AI-context governance workflow only after the owner approves the source-only placement, package-isolation proof, runtime fallback, failure-containment boundary, and terminal Git behavior. Do not add the skill or change the published payload during backlog intake.


      ## Lifecycle


      - Canonical state: `open`

      - Priority: `MEDIUM` → `P2 Normal`

      - Target release: `Unassigned`

      - Completed in: `Not completed`

      - Published in: `Not applicable — source repository only`

      - Original created at: `2026-07-28T22:31:00+08:00`

      - Original updated at: `2026-07-28T22:31:00+08:00`

      - Owner decision: Decide whether to introduce the repo-only ai-context-release-closeout capability, where its canonical and runtime files belong, how packaged ai-context-governance remains independent, which Python or uv fallback is supported, and how temporary-worktree failure containment behaves before and after commit, push, PR, or merge.


      ## Delivery Evidence


      - No delivery evidence is available; owner review is required before closure.


      - Evidence classification: `needs-owner-review`


      ## Related Work


      - No explicit parent, sub-issue, or related backlog relationship is recorded.


      ## Community Feedback


      Comments in English or Traditional Chinese (Taiwan) are welcome. Feedback does not automatically change canonical requirements, scope, priority, owner approval, or repository workflow authorization.



  issue:
    title: '[PKG-001] Publish Executable Version-To-Version Migration Metadata'
    body: '## Story Statement


      As a framework maintainer or downstream adopter,


      I want **Publish Executable Version-To-Version Migration Metadata**,


      so that make the published package migration metadata executable for every declared governed upgrade source instead of emitting a clean-install-only manifest.


      ## Outcome


      Make the published package migration metadata executable for every declared governed upgrade source instead of emitting a clean-install-only manifest.


      ## Acceptance Criteria


      - Every release that declares a governed automatic or guided source emits migration.from identity matching that source manifest.

      - The extracted package planner accepts the declared previous files manifest and produces deterministic add, replace, remove, rename, and reconcile operations.

      - A disposable repository installed from the governed v0.3.0 package upgrades to the v0.4.1 candidate using only published envelope assets and documented commands.

      - Clean-install behavior remains independently supported and validated.

      - Package archives built twice from the same immutable ref remain byte-identical.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `story`

      - Scope: `framework`

      - Classification evidence: Downstream adopters need deterministic executable version-to-version migration metadata.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Resume the active v0.4.1 remediation workflow and implement V041-002 before lower-priority content corrections.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.4.1`

      - Completed in: `v0.4.1`

      - Published in: `v0.4.1`

      - Original created at: `2026-07-18T21:39:19+08:00`

      - Original updated at: `2026-07-18T23:47:03+08:00`


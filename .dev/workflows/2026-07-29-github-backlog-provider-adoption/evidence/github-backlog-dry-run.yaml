  issue:
    title: '[DIST-001] Define Downstream Product And Component Distribution Contract'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Define Downstream Product And Component Distribution Contract**

      - Benefit: Define the mandatory software-development and AI-context lifecycle cores, optional provider model, source-only boundary, component selection, and release validation matrix before v0.6.0 packaging or simplification closes.


      ## Outcome


      Define the mandatory software-development and AI-context lifecycle cores, optional provider model, source-only boundary, component selection, and release validation matrix before v0.6.0 packaging or simplification closes.


      ## Acceptance Criteria


      - A canonical capability matrix classifies every distributed surface as mandatory core, selected technology profile, optional provider, target-owned seed, or source-only.

      - The mandatory software-development core preserves requirements, specification, problem framing, DDD and architecture, test design, implementation, review, target-aware test execution, selectable compliance validation, and .dev/workflows/ lifecycle capability.

      - Spec compliance capability is distributed but not universally activated; an explicit target profile, problem-frame workflow, requirement, or owner decision selects its 100 percent fail-closed gate.

      - The test-execution contract supports unit and integration tests by default and conditional specialized test capabilities without requiring a new v0.6.0 test skill.

      - The mandatory AI-context lifecycle core preserves initialization, auditor, target-facing governance, upgrader, provenance, customization reconciliation, and independent post-upgrade verification.

      - Repository backlog storage is an optional provider; software-development workflows remain valid when Azure DevOps, Jira, GitHub Issues/Projects, another tracker, or no durable backlog provider is selected.

      - The selected component model declares dependency direction: an optional backlog provider may reference workflow identities, while workflow execution does not depend on repository backlog installation.

      - Clean-install defaults, target selection records, upgrade preservation, acknowledgement semantics, and removal behavior are explicit and deterministic.

      - Existing v0.5.0 targets preserve target-owned backlog and workflow data; reclassification never grants automatic deletion authority.

      - The package and migration schemas record enough component identity to reproduce, validate, and upgrade an installation without treating optional providers as implicit.

      - The target installation and component selection source of truth is `.dev/ai-context/provenance.yaml`; v0.6.0 migrates the legacy `.dev/AI-CONTEXT-SOURCE.yaml` path without creating dual authority.

      - The target semantic customization source of truth is one `.dev/ai-context/customizations.yaml` ledger referenced by provenance and governed by CUST-001.

      - DEVWF-002 proves the software-development core from high-level intent through approval pauses, implementation, selected tests and compliance, commit evidence, and closeout.

      - Downstream fixtures prove each supported core/profile/provider combination and exclude source-only release operations.

      - CI-001 and CI-002 enforce the approved release and component matrix without coupling general governance checks to a concrete release phase.

      - SIMPL-001 measures the approved product surfaces and cannot remove either mandatory core pillar merely because recent source work emphasized self-governance.

      - Future package-registry distribution remains deferred exploration and does not block v0.6.0.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source packaging controls and downstream component identity are both affected.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Implement the approved component model only after the exact schema, migration, and downstream acceptance fixtures are designed; do not change package bytes or close the v0.6.0 candidate from the planning decision alone.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`

      - Original created at: `2026-07-23T23:12:50+08:00`

      - Original updated at: `2026-07-24T15:15:15+08:00`

      - Owner decision: Owner decision recorded on 2026-07-23: use one versioned componentized release with mandatory software-development and AI-context lifecycle cores, a dotnet-backend profile, and an optional repository-backlog provider; new installs default the provider off and existing targets preserve and record it.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-23-v0-6-product-contract-planning/reports/remediation-report.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-23-v0-6-product-contract-planning/reports/remediation-report.md)


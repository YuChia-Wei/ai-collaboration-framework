    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Measured Active-Context Simplification And Archive Disposition**

      - Benefit: Measure actual loaded context, disposition Fable 5''s simplification candidates, and separate safe active-context reduction from conditional historical-evidence archiving.


      ## Outcome


      Measure actual loaded context, disposition Fable 5''s simplification candidates, and separate safe active-context reduction from conditional historical-evidence archiving.


      ## Acceptance Criteria


      - Measure context actually loaded by representative runtime, skill-routing, release, handoff, and development sessions; repository word count alone is not treated as token cost.

      - Disposition every Fable 5 simplification candidate as implement, merge into an owning item, defer to a named horizon, retain, or reject.

      - Active-context deletion occurs only after the retained rule has a mechanical validator, a routed on-demand source, or explicit evidence that the content is redundant.

      - Language, wrapper, and skill-family candidates remain coordinated with LANG-001, ENF-001, SAG-001, EVAL-001, and SKILL-001.

      - Standards simplification remains owned by STD-001, retains an unassigned release target during deliberation, and may become an independent release.

      - v0.6.0 may reduce default discovery of completed history while keeping workflow and assessment artifacts at their stable paths.

      - Historical artifacts are not moved, deleted, reduced to Git-only recovery, or replaced by summaries unless a v0.7.0 successor proves measurable benefit and satisfies the archive preconditions.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `framework`

      - Classification evidence: Measured context simplification changes reusable framework loading behavior.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Begin disposition only after v0.5.0 release, handoff, enforcement, tooling, and language safeguards are stable. Do not simplify standards through this item; route that work to STD-001.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `MEDIUM` → `P2 Normal`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`


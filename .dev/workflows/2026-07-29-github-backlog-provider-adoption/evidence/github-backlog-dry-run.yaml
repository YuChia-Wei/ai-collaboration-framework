    title: '[EVAL-001] Deterministic AI Behavior Regression And Model-In-The-Loop Evaluation'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Deterministic AI Behavior Regression And Model-In-The-Loop Evaluation**

      - Benefit: Establish deterministic output oracles and a budgeted release-side model evaluation before the v0.6.0 skill taxonomy and ai-context-init transition.


      ## Outcome


      Establish deterministic output oracles and a budgeted release-side model evaluation before the v0.6.0 skill taxonomy and ai-context-init transition.


      ## Acceptance Criteria


      - Deterministic fixtures cover empty, existing, and copied-template repository states.

      - A deterministic structural and semantic oracle is mandatory and can run without a model call.

      - Model-in-the-loop evaluation is release-side and opt-in outside release validation; routine downstream upgrades do not invoke it.

      - The evaluation plan declares model, judge, repetitions, prompt/context inputs, token ceiling, result retention, and failure disposition before execution.

      - Taxonomy or ai-context-init changes cannot proceed when deterministic regression fails or the approved model-evaluation threshold is not met.

      - Baseline and candidate results are comparable without treating one stochastic run as conclusive.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source evaluation gates provide release evidence for portable framework behavior.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Before v0.6.0 taxonomy implementation, approve the fixture corpus, deterministic oracle, model/judge configuration, sampling policy, and maximum token budget.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`

      - Original created at: `2026-07-19T12:27:12+08:00`

      - Original updated at: `2026-07-24T15:15:15+08:00`

      - Owner decision: Resolved: the owner selected gpt-5.6-terra instead of Sol; two fresh candidate runs and one independent Terra judge passed 8/8 critical safety and 8/8 full-rubric outcomes.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-24-v0-6-model-evaluation/reports/model-evaluation-report.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-24-v0-6-model-evaluation/reports/model-evaluation-report.md)


  issue:
    title: '[REL-001] Cold-Start-Safe Release Publication'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Cold-Start-Safe Release Publication**

      - Benefit: Make release publication executable from repository files alone through a runbook, placeholder templates, stale-value rejection, a pre-tag gate, and terminal-state validation.


      ## Outcome


      Make release publication executable from repository files alone through a runbook, placeholder templates, stale-value rejection, a pre-tag gate, and terminal-state validation.


      ## Acceptance Criteria


      - A canonical release-publication runbook gives each action an exact command, expected output, and fail action from candidate creation through post-publication finalization.

      - The runbook prohibits copying a previous release instance and routes agents to placeholder templates.

      - Release locator, task, registry, notes, and migration artifacts are instantiated from templates with no previous-version values.

      - Validation rejects unfilled placeholders, copied prior run IDs, impossible timestamps, unrelated backlog references, generated release-body content in authored sources, and empty migration guidance.

      - A sanctioned pre-tag command verifies the validated registry skeleton, clean authored sources, exact candidate identity, and a green critical gate before creating an annotated tag.

      - A terminal-state validator proves that an existing published tag has a published registry record whose commit equals the tag peel and whose authored notes contain no rendered provenance.

      - The release-specific validation route is exercised by the ENF-001 pull-request CI contract.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source publication mechanics create and finalize portable release artifacts.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Start after R042-005 closes. Coordinate the pull-request CI route with ENF-001, but keep release-specific runbook, templates, tag preparation, and terminal-state checks owned here.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.5.0`

      - Completed in: `v0.5.0`

      - Published in: `v0.5.0`

      - Original created at: `2026-07-20T22:23:02+08:00`

      - Original updated at: `2026-07-22T21:13:53+08:00`

      - Owner decision: Completed and published for v0.5.0: repository-owned templates, phase contracts, exact commands, stale-state rejection, pre-tag preparation, terminal validation, four-source artifacts, CI routing, hosted publication, and local finalization all passed.



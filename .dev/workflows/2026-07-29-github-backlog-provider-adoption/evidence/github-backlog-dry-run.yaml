  issue:
    title: '[CFG-001] Separate Source Repository Configuration From Downstream Templates'
    body: '## Enabler Statement


      - Beneficiary: framework maintainers and downstream adopters

      - Capability: **Separate Source Repository Configuration From Downstream Templates**

      - Benefit: Separate source-only EditorConfig and Git attributes from downstream target-template seeds, then formalize cross-platform text and immutable external-evidence handling.


      ## Outcome


      Separate source-only EditorConfig and Git attributes from downstream target-template seeds, then formalize cross-platform text and immutable external-evidence handling.


      ## Acceptance Criteria


      - ADR-001 is accepted, revised, or rejected with explicit evidence; implementation does not treat a Proposed ADR as approval.

      - Root .editorconfig and .gitattributes become source-repository truth and are no longer copied directly into downstream payloads.

      - Dedicated repo-structure-sync public-root templates map to downstream .editorconfig and .gitattributes as target-template seed files.

      - Existing downstream .editorconfig and .gitattributes remain target-owned and are never automatically overwritten during upgrade.

      - Source configuration uses one coherent Linux, macOS, and Windows text policy with narrow validated exceptions.

      - Immutable external originals use one centralized source rule and evidence/external/original convention; ordinary evidence remains text-diffable.

      - Package tests prove source-only assessment and evidence patterns are absent from downstream template bytes.

      - Package projection, ZIP/tar parity, migration metadata, clean install, and exact supported-source upgrades pass for the selected horizon.

      - If targeted to v0.5.1, prove no new schema, required consumer contract, published-path removal, or target overwrite semantics and add exact v0.5.0 source compatibility.

      - If patch compatibility cannot be proven, assign the item to v0.6.0 before implementation.


      ## Boundaries


      - No additional material constraints are recorded.


      ## Delivery Scope


      - Kind: `enabler`

      - Scope: `mixed`

      - Classification evidence: Source configuration separation controls both repository operation and downstream templates.

      - Recommended owner skill: `ai-context-governance`

      - Handoff condition: Execute in the coordinated v0.6.0 configuration and skill-transition workstream after ADR-001 is accepted, revised, or rejected with explicit evidence.


      ## Lifecycle


      - Canonical state: `resolved`

      - Priority: `HIGH` → `P1 High`

      - Target release: `v0.6.0`

      - Completed in: `v0.6.0`

      - Published in: `v0.6.0`

      - Original created at: `2026-07-23T00:29:56+08:00`

      - Original updated at: `2026-07-24T15:15:15+08:00`

      - Owner decision: Resolved: ADR-001 is accepted and source/downstream configuration, evidence, package, migration, and target-preservation contracts pass for v0.6.0.


      ## Delivery Evidence


      - Evidence: [.dev/workflows/2026-07-24-v0-6-config-skill-transition/reports/configuration-report.md](https://github.com/YuChia-Wei/ai-collaboration-prompts-dotnet-backend/blob/08b9fd9f75edc373b693f6c38242ba141917f2c2/.dev/workflows/2026-07-24-v0-6-config-skill-transition/reports/configuration-report.md)


acceptance:
  - "The contract distinguishes wall span, active execution, external wait, approval wait, environment retry, and unknown time instead of treating all elapsed time as agent work."
  - "Validator invocations record stable validator identity, input or revision fingerprint when available, outcome, duration, and whether unchanged evidence was reused."
  - "Delivery evidence records workflow start/end, task count, pull-request boundaries, checkpoint/resume events, and environment-related retries without inferring causality from Git timestamps alone."
  - "No raw prompt, conversation body, secret, credential, private machine activity, or provider-private token trace is stored."
  - "Unavailable token or model telemetry remains unknown and cannot be estimated from repository line counts."
  - "At least one completed release workflow and one non-release workflow produce comparable records before budgets or optimization gates are proposed."
  - "The schema has an explicit version, ownership, optionality, and downstream/source-only disposition."
inventory_notes:
  - "ASM-20260803-003 could reconstruct a 10:47:46 wall span but could not classify active, wait, retry, or token cost; that inability is the primary origin."
  - "The external review proposed a minimal structure-only record; this item retains that low-cost direction while requiring explicit evidence semantics."
  - "This item does not authorize an archive threshold or release allocation."
  - "GitHub Issue #95 is the source repository work-management projection; provider state does not authorize execution."

  - "POSIX-sh and Windows-PowerShell launchers remain thin prerequisite and diagnostic adapters that delegate validator semantics to Python."
  - "Issue #75 owns aggregate composition, performance, package disposition, and portable-handoff policy."
  - "Issue #76 owns generalized environment-readiness profiles and policy-aware host or runtime capabilities."

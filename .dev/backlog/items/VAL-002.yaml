acceptance:
  - "Source CI/release, downstream workflow, and framework self-test responsibilities are explicit and independently invocable."
  - "The source critical gate remains complete and fail-closed for release and source-governance changes."
  - "A downstream workflow runs target-owned tests plus only the framework validators required by its selected capabilities and current transition."
  - "Changed-path selection is dependency-aware, deterministic, and covered by positive and negative fixtures; unknown impact fails closed or escalates to the full applicable profile."
  - "Each selected check has a declared time budget and reports timeout, failed, blocked-by-environment, skipped-by-proven-input, or passed without conflation."
  - "Validation reuse requires an input fingerprint and never reuses evidence after relevant bytes, configuration, runtime, or policy change."
  - "Windows, hosted Ubuntu, clean-install, and supported-upgrade evidence prove equivalent pass/fail semantics."
  - "The change does not add token telemetry, weaken prerequisites, or assign itself to a release."
inventory_notes:

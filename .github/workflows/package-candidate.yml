# Snapshot builds are selected only by product or build-tool changes.
name: Build framework snapshot
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'YuChia-Wei/ai-collaboration-framework' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TOOLING_COMMIT: ${{ github.workflow_sha }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout immutable workflow tooling without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Builder dependency
        run: python -I -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Build and verify exact source snapshot
        id: build
        shell: bash
        run: |
          python -I -B .github/scripts/build-release.py \
            --repository "$GITHUB_WORKSPACE" --source-commit "$SOURCE_COMMIT" \
            --tooling-commit "$TOOLING_COMMIT" --workflow-commit "$TOOLING_COMMIT" \
            --workflow .github/workflows/package-candidate.yml \
            --repository-name "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --work-root "$RUNNER_TEMP/rb" --output "$RUNNER_TEMP/release-assets" --github-output "$GITHUB_OUTPUT"
      - name: Retain complete snapshot package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ steps.build.outputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain builder diagnostic output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rb/builder.stdout
            ${{ runner.temp }}/rb/builder.stderr
          if-no-files-found: ignore
          retention-days: 14

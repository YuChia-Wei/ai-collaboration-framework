name: Portable AI Context Gates

on:
  pull_request:
    paths:
      - ".ai/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".dev/assessments/**"
      - ".dev/backlog/**"
      - ".dev/standards/**"
      - ".dev/workflows/**"
      - ".github/agents/**"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prerequisite-posix:
    name: Ubuntu prerequisite contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run shared and POSIX prerequisite contracts
        shell: bash
        run: |
          python .ai/scripts/tests/test_python_prerequisites.py -v
          python .ai/scripts/tests/test_python_entrypoints_contract.py -v
          python .ai/scripts/tests/test_run_python_entrypoint_sh.py -v

  prerequisite-windows:
    name: Windows prerequisite contract
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run shared and PowerShell prerequisite contracts
        shell: pwsh
        run: |
          python .ai/scripts/tests/test_python_prerequisites.py -v
          python .ai/scripts/tests/test_python_entrypoints_contract.py -v
          python .ai/scripts/tests/test_run_python_entrypoint_ps1.py -v

  quick:
    name: Ubuntu PR profile gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the canonical PR profile
        shell: bash
        run: |
          args=(--profile pr)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            args+=(--base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}")
          fi
          bash .ai/scripts/check-all.sh "${args[@]}"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-validation-portable-gates-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/validation

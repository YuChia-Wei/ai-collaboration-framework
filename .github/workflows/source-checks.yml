# The owner selects product/build changes through GitHub's native path filter.
name: Source checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tools/**'
permissions: {}
concurrency:
  group: source-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-change:
    name: Source change gate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -I -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Run framework and packaging checks
        run: python -I -B tests/run.py

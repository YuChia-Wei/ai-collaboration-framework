name: Check Release Provider Access

on:
  workflow_dispatch:
    inputs:
      version:
        description: Governed release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      phase:
        description: Use verify for an already published and reconciled release
        required: true
        default: verify
        type: choice
        options:
          - verify
          - preflight

permissions: {}

jobs:
  provider-check:
    name: Read-only release provider check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ai-context-release
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PHASE: ${{ inputs.phase }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install provider reconciliation dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate read-only request
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH versions are accepted." >&2
            exit 1
          fi
          case "${PHASE}" in
            preflight|verify) ;;
            *) echo "Only read-only preflight or verify is allowed." >&2; exit 1 ;;
          esac
          python .ai/scripts/reconcile-ai-context-release-provider.py \
            --phase contract --version "${VERSION}"

      - name: Check configured release provider access and state
        id: provider
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PROVIDER_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "RELEASE_PROVIDER_TOKEN is unavailable in ai-context-release; ask the owner to review the existing credential configuration." >&2
            exit 1
          fi
          gh --version
          python .ai/scripts/reconcile-ai-context-release-provider.py \
            --phase "${PHASE}" --version "${VERSION}" \
            --output "${RUNNER_TEMP}/provider-check/read-back.json"

      - name: Record execution identity and actual outcome
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = {
              "schema_version": "1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "version": os.environ["VERSION"],
              "phase": os.environ["PHASE"],
              "provider_step_outcome": os.environ["PROVIDER_OUTCOME"],
              "provider_mutations": False,
              "environment": "ai-context-release",
              "credential_reference": "RELEASE_PROVIDER_TOKEN",
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "provider-check"
          output.mkdir(parents=True, exist_ok=True)
          (output / "execution.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Retain bounded provider check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-check-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/provider-check/*.json

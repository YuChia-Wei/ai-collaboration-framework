# Draft delivery only. No test execution, generated AI notes or public publication.
name: Prepare framework draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable or rc.N tag; use workflow from main
        required: true
        type: string
permissions: {}
concurrency:
  group: release-draft-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'YuChia-Wei/ai-collaboration-framework' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      tooling_commit: ${{ github.workflow_sha }}
      build_attempt: ${{ github.run_attempt }}
    env:
      TOOLING_COMMIT: ${{ github.workflow_sha }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout workflow tooling separately from selected product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Builder dependency
        run: python -I -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Build isolated exact annotated tag source
        id: build
        shell: bash
        run: |
          python -I -B .github/scripts/build-release.py \
            --repository "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" \
            --tooling-commit "$TOOLING_COMMIT" --workflow-commit "$TOOLING_COMMIT" \
            --workflow .github/workflows/publish-release.yml \
            --repository-name "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --work-root "$RUNNER_TEMP/rb" --output "$RUNNER_TEMP/release-assets" --github-output "$GITHUB_OUTPUT"
      - name: Admit exact package bytes for writer and retries
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.build.outputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain builder diagnostic output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rb/builder.stdout
            ${{ runner.temp }}/rb/builder.stderr
          if-no-files-found: ignore
          retention-days: 30
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TOOLING_COMMIT: ${{ needs.build.outputs.tooling_commit }}
      BUILD_ATTEMPT: ${{ needs.build.outputs.build_attempt }}
    steps:
      - name: Checkout admitted immutable writer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.tooling_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download exact build job artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Create owned draft and verify every provider asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -I -B .github/scripts/draft-release.py \
            --assets "$RUNNER_TEMP/release-assets" --repository "$GITHUB_REPOSITORY" \
            --expected-tag "$RELEASE_TAG" --expected-tooling-commit "$TOOLING_COMMIT" \
            --expected-run-id "$GITHUB_RUN_ID" --expected-build-attempt "$BUILD_ATTEMPT" \
            --receipt "$RUNNER_TEMP/draft-receipt.json"
      - name: Retain draft outcome including partial failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-receipt.json
          if-no-files-found: warn
          retention-days: 30

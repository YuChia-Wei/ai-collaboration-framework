name: Refactoring acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/tools/dotnet/refactoring/**'
      - 'tests/dotnet-refactoring/**'
      - '.github/workflows/refactoring-checks.yml'
      - 'tests/dotnet-test-support/**'
      - 'src/tools/dotnet/AICF.Dotnet.Tools.slnx'
      - 'src/tools/dotnet/AICF.Dotnet.Artifacts.slnx'
permissions: {}
concurrency:
  group: refactoring-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  refactoring:
    name: RefactorTool (win-x64, SDK 10.0.403)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.403'
      - name: Publish complete managed artifact with notices
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/refactor-build" | Out-Null
          @{sdk=@{version='10.0.403';rollForward='disable'}} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/refactor-build/global.json"
          Set-Location "$env:RUNNER_TEMP/refactor-build"
          & "$env:GITHUB_WORKSPACE/src/tools/dotnet/refactoring/Publish-RefactorTool.ps1" -Destination "$env:RUNNER_TEMP/refactor-publish" -Archive "$env:RUNNER_TEMP/RefactorTool-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/RefactorTool-win-x64.zip" -DestinationPath "$env:RUNNER_TEMP/refactor-installed"
      - name: Run unit, integration and extracted artifact tests
        env:
          AICF_REFACTOR_TEST_ARTIFACT: ${{ runner.temp }}/refactor-installed/RefactorTool.exe
        run: |
          Set-Location "$env:RUNNER_TEMP/refactor-build"
          $env:AICF_TEST_WORK = "$env:RUNNER_TEMP/refactor-fixtures"
          $results = "$env:RUNNER_TEMP/refactor-test-results"
          $refactoring = "$env:GITHUB_WORKSPACE/tests/dotnet-refactoring"
          $check = "$env:GITHUB_WORKSPACE/tests/dotnet-test-support/Assert-ExecutedTests.ps1"
          dotnet test "$refactoring/unit/RefactorTool.UnitTests.csproj" -c Release --results-directory $results --logger 'trx;LogFileName=unit.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $check -Report "$results/unit.trx" -Expected 3
          dotnet test "$refactoring/integration/RefactorTool.IntegrationTests.csproj" -c Release --results-directory $results --logger 'trx;LogFileName=integration.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $check -Report "$results/integration.trx" -Expected 122
          dotnet test "$refactoring/artifact/RefactorTool.ArtifactIntegrationTests.csproj" -c Release --results-directory $results --logger 'trx;LogFileName=artifact.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $check -Report "$results/artifact.trx" -Expected 5
      - name: Record archive checksum
        run: |
          $archive = Get-Item -LiteralPath "$env:RUNNER_TEMP/RefactorTool-win-x64.zip"
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          "$checksum  $($archive.Name)" | Set-Content -Encoding ascii -LiteralPath "$($archive.FullName).sha256"
          Write-Host "$($archive.Name): $($archive.Length) bytes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RefactorTool-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/RefactorTool-win-x64.zip
            ${{ runner.temp }}/RefactorTool-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: AI Context Governance

on:
  pull_request:
    paths:
      - ".ai/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".dev/TEAM-GIT-FLOW-RULES.MD"
      - ".dev/adr/ADR-TEMPLATE.md"
      - ".dev/adr/README.md"
      - ".dev/adr/WHEN-TO-CREATE-ADR.MD"
      - ".dev/assessments/README.MD"
      - ".dev/assessments/templates/**"
      - ".dev/backlog/**"
      - ".dev/domain-language/README.MD"
      - ".dev/domain-language/templates/**"
      - ".dev/guides/**"
      - ".dev/operations/**"
      - ".dev/problem-frames/README.MD"
      - ".dev/problem-frames/SEMANTICS.md"
      - ".dev/problem-frames/templates/**"
      - ".dev/requirement/REQUIREMENT-GUIDE.MD"
      - ".dev/releases/**"
      - ".dev/specs/**"
      - ".dev/standards/**"
      - ".dev/workflows/README.MD"
      - ".dev/workflows/handoff-checkpoints.yaml"
      - ".dev/workflows/**/handoff-checkpoints/**"
      - ".github/agents/**"
      - ".github/workflows/governance.yml"
      - "AGENTS.md"
      - "AGENTS.zh-TW.md"
      - "CLAUDE.md"
      - "README.en.md"
      - "README.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: Read-only governance contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the canonical fast governance profile
        shell: bash
        run: bash .ai/scripts/check-all.sh --profile fast

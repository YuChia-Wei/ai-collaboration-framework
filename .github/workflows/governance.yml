name: AI Context Governance

on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: Read-only governance contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the canonical fast governance profile
        shell: bash
        run: |
          args=(--profile fast)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            args+=(--base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}")
          fi
          bash .ai/scripts/check-all.sh "${args[@]}"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-context-validation-governance-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/validation

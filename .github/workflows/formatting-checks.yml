name: Formatting acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/tools/dotnet/formatting/**'
      - 'tests/dotnet-formatting/**'
      - '.github/workflows/formatting-checks.yml'
      - 'tests/dotnet-test-support/**'
      - 'src/tools/dotnet/AICF.Dotnet.Tools.slnx'
permissions: {}
concurrency:
  group: formatting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  formatting:
    name: Formatting script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Check and apply formatting in a disposable workspace
        run: |
          $results = "$env:RUNNER_TEMP/format-test-results"
          $env:AICF_TEST_WORK = "$env:RUNNER_TEMP/format-workspaces"
          dotnet test tests/dotnet-formatting/integration/Formatting.ScriptIntegrationTests.csproj -c Release --results-directory $results --logger 'trx;LogFileName=format.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/dotnet-test-support/Assert-ExecutedTests.ps1 -Report "$results/format.trx" -Expected 2

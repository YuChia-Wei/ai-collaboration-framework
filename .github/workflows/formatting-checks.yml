name: Formatting acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/tools/dotnet/formatting/**'
      - 'tests/dotnet-formatting/**'
      - '.github/workflows/formatting-checks.yml'
      - 'tests/dotnet-test-support/**'
      - 'src/tools/dotnet/AICF.Dotnet.Tools.slnx'
      - '.github/scripts/build-generation.py'
permissions: {}
concurrency:
  group: formatting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  formatting:
    name: FormatTool (${{ matrix.rid }}, SDK ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            sdk: '10.0.403'
            executable: FormatTool.exe
          - os: macos-26
            rid: osx-arm64
            sdk: '10.0.400'
            executable: FormatTool
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build and formatter SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.403
            ${{ matrix.sdk }}
      - name: Publish Native AOT with patched build SDK
        env:
          FORMAT_RID: ${{ matrix.rid }}
        run: |
          $buildArea = Join-Path $env:RUNNER_TEMP 'format-build'
          New-Item -ItemType Directory -Path $buildArea | Out-Null
          @{sdk=@{version='10.0.403';rollForward='disable'}} | ConvertTo-Json | Set-Content (Join-Path $buildArea 'global.json')
          Set-Location $buildArea
          dotnet publish "$env:GITHUB_WORKSPACE/src/tools/dotnet/formatting/FormatTool.csproj" -c Release -r $env:FORMAT_RID --self-contained true -p:PublishAot=true -p:PublishSingleFile=false -p:CopyOutputSymbolsToPublishDirectory=false --artifacts-path "$buildArea/artifacts" -o "$env:RUNNER_TEMP/format-publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run FormatTool tests and exercise the published executable
        env:
          FORMAT_EXE: ${{ matrix.executable }}
          FORMAT_SDK: ${{ matrix.sdk }}
          AICF_FORMAT_SDK_TESTS: '1'
        run: |
          $env:AICF_FORMAT_ARTIFACT = "$env:RUNNER_TEMP/format-publish/$env:FORMAT_EXE"
          $env:AICF_TEST_WORK = "$env:RUNNER_TEMP/format-acceptance"
          $testFilter = 'Boundary!=CaseSensitiveArtifact'
          $expected = 25
          if ($IsWindows) {
            $testFilter += '&Platform!=MacOS'
            $expected = 22
          }
          $results = "$env:RUNNER_TEMP/format-test-results"
          # dotnet test supplies MSBuildSDKsPath to the test host and its child SDK commands.
          New-Item -ItemType Directory -Path $env:AICF_TEST_WORK | Out-Null
          @{sdk=@{version=$env:FORMAT_SDK;rollForward='disable'}} | ConvertTo-Json | Set-Content (Join-Path $env:AICF_TEST_WORK 'global.json')
          Set-Location $env:AICF_TEST_WORK
          dotnet test "$env:GITHUB_WORKSPACE/tests/dotnet-formatting/unit/FormatTool.UnitTests.csproj" -c Release --artifacts-path "$env:RUNNER_TEMP/format-test-artifacts" --results-directory $results --logger 'trx;LogFileName=format-unit.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/tests/dotnet-test-support/Assert-ExecutedTests.ps1" -Report "$results/format-unit.trx" -Expected 6
          dotnet test "$env:GITHUB_WORKSPACE/tests/dotnet-formatting/FormatTool.IntegrationTests.csproj" -c Release --filter $testFilter --artifacts-path "$env:RUNNER_TEMP/format-test-artifacts" --results-directory $results --logger 'trx;LogFileName=format.trx'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/tests/dotnet-test-support/Assert-ExecutedTests.ps1" -Report "$results/format.trx" -Expected $expected
      - name: Verify exact selection on case-sensitive APFS
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          image="$RUNNER_TEMP/format-case-sensitive.sparseimage"
          mount="$RUNNER_TEMP/format-case-sensitive"
          hdiutil create -size 256m -fs "Case-sensitive APFS" -type SPARSE -volname FormatAcceptance "$image"
          mkdir -p "$mount"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse
          trap 'hdiutil detach "$mount"' EXIT
          cd "$RUNNER_TEMP/format-acceptance"
          results="$RUNNER_TEMP/format-test-results"
          AICF_FORMAT_ARTIFACT="$RUNNER_TEMP/format-publish/FormatTool" AICF_FORMAT_CASE_ROOT="$mount/acceptance" \
            dotnet test "$GITHUB_WORKSPACE/tests/dotnet-formatting/FormatTool.IntegrationTests.csproj" -c Release --no-build --filter 'Boundary=CaseSensitiveArtifact' --artifacts-path "$RUNNER_TEMP/format-test-artifacts" --results-directory "$results" --logger 'trx;LogFileName=case-sensitive.trx'
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/tests/dotnet-test-support/Assert-ExecutedTests.ps1" -Report "$results/case-sensitive.trx" -Expected 1

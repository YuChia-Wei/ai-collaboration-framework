asset_id: "slice-implementer"
schema_version: "1.0"
asset_type: "skill-spec"
title: "Slice Implementer"
purpose: "Implement one bounded implementation slice from requirements, specs, architecture decisions, review findings, or workflow tasks without redefining the architecture direction."
portability: "repo-portable"
audience: "agent-facing"
source_of_truth: "canonical"
capability_slots:
  - "implementation"
triggers:
  - "slice implementer"
  - "implement slice"
  - "bounded implementation slice"
  - "feature slice"
  - "fix slice"
  - "remediation slice"
inputs:
  - "authorization source, normative truth, and optional finding evidence"
  - "bounded slice goal, acceptance criteria, and explicit non-goals"
  - "intent, scope, execution mode, and optional overlays"
  - "validation requirements"
outputs:
  - "bounded implementation slice"
  - "intent, execution mode, overlays, and reference paths used"
  - "touched files and validation notes"
  - "explicit handoff if architecture, local change, test design, review, or compliance work remains"
constraints:
  - "Do not redefine architecture direction mid-slice"
  - "Do not silently broaden the agreed slice"
  - "Select exactly one execution mode reference: command, query, reactor, or generic"
  - "Apply remediation as an overlay without replacing the selected execution mode"
  - "Do not treat workflow authorization or finding evidence as a substitute for normative requirements, specs, standards, or ADRs"
  - "Delegate local class/object/symbol technical edits to local-change-implementer when useful"
  - "Stop and hand off when bounded context, aggregate boundary, dependency direction, or domain language is unclear"
workflow:
  - step: 1
    description: "Confirm slice goal, intent, scope, execution mode, overlays, layered sources, acceptance criteria, and non-goals"
  - step: 2
    description: "Load exactly one execution mode reference, any applicable overlay, and required local standards"
  - step: 3
    description: "Implement the smallest coherent slice and delegate local technical changes when useful"
  - step: 4
    description: "Validate, record touched files, and hand off remaining architecture, testing, review, or compliance work"
references:
  - ".ai/assets/skills/slice-implementer/references/input-contract.md"
  - ".ai/assets/skills/slice-implementer/references/execution-playbook.md"
  - ".ai/assets/skills/slice-implementer/references/handoff-rules.md"
  - ".ai/assets/skills/slice-implementer/references/modes/command-use-case.md"
  - ".ai/assets/skills/slice-implementer/references/modes/query-use-case.md"
  - ".ai/assets/skills/slice-implementer/references/modes/reactor.md"
  - ".ai/assets/skills/slice-implementer/references/modes/generic-slice.md"
  - ".ai/assets/skills/slice-implementer/references/overlays/remediation.md"
examples:
  - ".dev/guides/ai-collaboration-guides/SLICE-IMPLEMENTER-SKILL-GUIDE.md"
human_guide: ".dev/guides/ai-collaboration-guides/SLICE-IMPLEMENTER-SKILL-GUIDE.md"
wrapper_targets:
  - "claude"
  - "codex"
wrapper_metadata:
  claude:
    wrapper_path: ".claude/skills/slice-implementer/"
  codex:
    wrapper_path: ".agents/skills/slice-implementer/"
status: "active"
effective_rule_consumption:
  applies_when:
    - "The skill implements one bounded command, query, reactor, or generic slice selected by the task."
  excludes:
    - "Architecture redesign, unbounded multi-slice work, or a handoff that does not implement the selected slice."
  resolver: ".ai/scripts/resolve-effective-rule-packet.py"
  selectors:
    - "capability"
    - "execution_mode"
    - "technology_profile"
    - "file_type"
  unresolved_outcome: "stop-applicable-action"
  consumption_order: "Consume a freshness-verified task-scoped packet before reading profile references needed for the applicable action."
  evidence:
    required:
      - "resolver_outcome"
      - "loaded_rule_ids"
      - "baseline.framework_version"
      - "target_state.digest"
      - "request.capability"
      - "request.execution_mode"
      - "request.technology_profile"
      - "request.file_type"
  semantic_consistency:
    identity: "rule_id"
    statement_bytes: "exact UTF-8 rules[].normative_statement bytes"
    statement_digest: "rules[].normative_statement_digest"
    cross_consumer_requirement: "the same rule_id must resolve to byte-equivalent effective semantics across consumers"
    default_mismatch_outcome: "warning"
    stricter_policy_owner: "target-owned"
  prohibitions:
    - "Do not scan broad target or framework documents to discover rule semantics."
    - "Do not fall back to framework defaults."
    - "Do not select an alternate route when the exact request route is unresolved."
    - "Do not compare analyzer output as effective-rule semantics."
    - "Keep analyzer severity and warnings-as-errors separate and target-owned."

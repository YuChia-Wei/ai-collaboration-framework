schema_version: "<release-record-schema-version>"
release_id: "REL-<vMAJOR.MINOR.PATCH>"
version: "<vMAJOR.MINOR.PATCH>"
status: "validated"
record_origin: "governed"
distribution_kind: "governed-package"
installable: true
tag: null
commit: null
tagged_at: null
recorded_at: null
created_at: "<ISO-8601-offset-timestamp>"
updated_at: "<ISO-8601-offset-timestamp>"
planning:
  # Source-repository releases from v0.10.0 onward bind release scope to live
  # GitHub Issues. Historical releases retain their existing backlog_refs.
  github_issue_refs:
    - "#<online-github-issue-number>"
provider_reconciliation:
  # 1.0 requires all five canonical Project fields below. Use 1.1 only when an
  # owner-approved release contract intentionally treats omitted canonical
  # Project fields as advisory; unknown fields always fail closed.
  schema_version: "1.0"
  provider: "github"
  repository: "YuChia-Wei/ai-collaboration-framework"
  project_owner: "YuChia-Wei"
  project_number: 3
  included_issue_refs_source: "planning.github_issue_refs"
  included_work:
    prepublication:
      issue_state: "closed"
      state_reason: "completed"
      project:
        Status: "Done"
        Priority: "P1 High"
        Owner review: "Approved"
        Target release: "<vMAJOR.MINOR.PATCH>"
        Published in: "Not yet published"
    postpublication:
      issue_state: "closed"
      state_reason: "completed"
      project:
        Status: "Done"
        Priority: "P1 High"
        Owner review: "Approved"
        Target release: "<vMAJOR.MINOR.PATCH>"
        Published in: "<vMAJOR.MINOR.PATCH>"
  coordination:
    issue_refs:
      - "#<release-coordination-issue-number>"
    prepublication:
      issue_state: "open"
      state_reason: null
      project:
        Status: "Planned"
        Priority: "P1 High"
        Owner review: "Approved"
        Target release: "<vMAJOR.MINOR.PATCH>"
        Published in: "Not applicable — not a release item"
    postpublication:
      issue_state: "closed"
      state_reason: "completed"
      project:
        Status: "Done"
        Priority: "P1 High"
        Owner review: "Approved"
        Target release: "<vMAJOR.MINOR.PATCH>"
        Published in: "Not applicable — not a release item"
compatibility:
  breaking_changes: <true-or-false>
  # v0.14.0 and later retain v0.6.0, v0.9.0, and the immediate predecessor in
  # the source-only support matrix until an explicit owner deprecation.
  # automatic_upgrade_sources must equal the exact package migration inputs in
  # canonical numeric ascending order.
  # From v0.16.0 all three origins require actual direct edges; an intermediate
  # upgrade chain cannot substitute for one retained migration source.
  minimum_source_version: "v0.6.0"
  reconciliation_sources:
    - "<immediate-predecessor>"
    - "v0.9.0"
    - "v0.6.0"
  automatic_upgrade_sources:
    - "v0.6.0"
    - "v0.9.0"
    - "<immediate-predecessor>"
  affected_contracts:
    - "<affected-public-contract>"
artifacts:
  release_notes: "release-notes.md"
  migration_guide: "migration-guide.md"
  support_matrix: "support-matrix.yaml"
  route_evidence:
    - "route-evidence/<immediate-predecessor>-to-<vMAJOR.MINOR.PATCH>.json"
    - "route-evidence/v0.9.0-to-<vMAJOR.MINOR.PATCH>.json"
    - "route-evidence/v0.6.0-to-<vMAJOR.MINOR.PATCH>.json"
distribution:
  profile_id: "dotnet-backend"
  package_id: "ai-context-dotnet-backend-<vMAJOR.MINOR.PATCH>"
  schema_versions:
    package: "<package-schema-version>"
    files: "<files-schema-version>"
    migration: "<migration-schema-version>"
  artifacts:
    zip: "ai-context-dotnet-backend-<vMAJOR.MINOR.PATCH>.zip"
    zip_checksum: "ai-context-dotnet-backend-<vMAJOR.MINOR.PATCH>.zip.sha256"
    tar_gz: "ai-context-dotnet-backend-<vMAJOR.MINOR.PATCH>.tar.gz"
    tar_gz_checksum: "ai-context-dotnet-backend-<vMAJOR.MINOR.PATCH>.tar.gz.sha256"
  migration:
    default_mode: "dry-run"
    apply_requires_clean_worktree: true
    apply_requires_acknowledged_reconciliation: true
  publication:
    tag_owner: "user"
    trigger: "user-created-tag"
    automation: "github-actions"
    creates_or_moves_tag: false
validation:
  evidence: "<validation-evidence-summary>"
  workflow_id: "<workflow-id>"
  related_workflows: []
  related_assessments: []
  package_status: "<planned-or-validated>"
  post_merge_status: "pending"
  failed_publication_run: null
  published_run: null
  public_release_url: null

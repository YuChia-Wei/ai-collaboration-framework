schema_version: "1.0"
record_type: "external-task-completion"
delegation_id: "<matching-delegation-id>"
source_task_id: "<resolved-source-task-id>"
delegated_task_id: "<runtime-task-id>"
subject:
  expected_commit_sha: "<full immutable Git SHA>"
  observed_commit_sha: "<full observed Git SHA>"
preflight:
  commit_matches: true
  clean_worktree: true
execution:
  working_directory: "<exact working directory>"
  argv: ["<executable>", "<arg-1>"]
timing:
  started_at: "<ISO-8601 with offset>"
  completed_at: "<ISO-8601 with offset>"
  duration_seconds: 0
result:
  outcome: "passed" # passed | failed | blocked-by-environment | timed-out | interrupted
  exit_code: 0
  counts: null
evidence:
  refs: ["<log, check, artifact, or runtime receipt reference>"]
  bounded_output: "<bounded terminal summary>"
final_state:
  clean_worktree: true
  tracked_changes: []
delivery:
  mode: "source-task-callback" # source-task-callback | parent-event-wait | single-terminal-readback
  destination: "source-task"
  terminal_report_number: 1

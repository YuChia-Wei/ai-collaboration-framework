schema_version: '1.3'
contract_id: external-task-delegation
purpose: Provider-neutral dispatch, terminal-result candidate, and independently produced
  custody receipt for bounded work executed in a separate runtime task.
prompt_transport:
  begin_marker: BEGIN_EXTERNAL_TASK_DELEGATION
  end_marker: END_EXTERNAL_TASK_DELEGATION
  dispatch_records_per_prompt: 1
  context_outside_envelope: allowed
completion_transport:
  begin_marker: BEGIN_EXTERNAL_TASK_COMPLETION
  end_marker: END_EXTERNAL_TASK_COMPLETION
  completion_records_per_message: 1
  context_outside_envelope: allowed
receipt_transport:
  begin_marker: BEGIN_EXTERNAL_TASK_VALIDATION_RECEIPT
  end_marker: END_EXTERNAL_TASK_VALIDATION_RECEIPT
  receipt_records_per_message: 1
record_types:
  dispatch: external-task-dispatch
  completion: external-task-completion
  validation_receipt: external-task-validation-receipt
dispatch:
  source:
    task_id_sources:
    - explicit
    - runtime-injected
    explicit_requires:
    - task_id
  objective: {}
  subject:
    commit_sha: full 40- or 64-character hexadecimal Git object ID
    clean_worktree_required: true
  execution:
    argv: non-empty argument vector; do not rely on an implicit shell wrapper
    timeout_seconds: positive integer covering command execution, not parent wait
      transport
  execution_packet:
    schema_ref: .ai/assets/shared/agent-execution-guardrails.schema.yaml
    validator: .ai/scripts/validate-agent-execution-guardrails.py --packet <packet-ref>
    packet_sha256: SHA-256 of the exact packet file bytes; the packet's internal packet_sha256
      independently seals canonical content
    binding: load the contained packet, run the canonical packet validator, and match
      subject, argv, cwd, and integration owner
    validation_outcome: passed
  permissions:
    allowed_write_scope:
    - ignored-validation-artifacts
    repair_allowed: false
    external_mutations: []
    secret_values: prohibited
  completion_delivery:
    primary_modes:
    - source-task-callback
    - parent-event-wait
    fallback_modes:
    - parent-event-wait
    - single-terminal-readback
    - none
    destination: source-task
    progress_updates: terminal-only
    max_terminal_reports: 1
    report_schema: same-contract#completion
    pre_send_validation:
      required_value: true
      receipt_writer_argv: canonical delegation validator with --candidate candidate_ref
        --dispatch dispatch_ref --write-receipt receipt_ref
      failure_action: do-not-deliver-terminal-report
      payload_binding: exact-candidate-bytes-with-independent-receipt
completion:
  candidate_semantics: This is a terminal-result candidate. It contains no self-asserted
    validator outcome and remains in custody until a matching receipt is produced.
  subject: {}
  preflight: {}
  execution: {}
  timing:
    timestamps: ISO 8601 with an explicit UTC offset
  result:
    outcomes:
    - passed
    - failed
    - blocked-by-environment
    - timed-out
    - interrupted
    counts: null when the runner exposes no counts; otherwise a mapping of non-negative
      integers
  evidence:
    minimum: at least one non-empty ref or bounded_output
  final_state: {}
  delivery:
    modes:
    - source-task-callback
    - parent-event-wait
    - single-terminal-readback
    destination: source-task
    terminal_report_number: 1
validation_receipt:
  receipt_ref: must match dispatch pre_send_validation.receipt_ref
  candidate:
    sha256: lowercase SHA-256 of the exact candidate file bytes
  dispatch:
    sha256: lowercase SHA-256 of the exact dispatch file bytes
  validator:
    script_sha256: lowercase SHA-256 of the exact canonical validator script bytes
    exit_code: 0
  custody:
    state: released
    release_scope: one matching terminal candidate delivery
cross_record:
  required_equal:
  - delegation_id
  - subject.commit_sha=subject.expected_commit_sha
  - execution.working_directory
  - execution.argv
  passed_requires:
  - expected and observed commit SHA match
  - preflight commit_matches and clean_worktree are true
  - exit_code is zero
  - final worktree is clean with no tracked changes
transport_semantics:
  parent_wait_timeout: pending-awaiting-completion
  callback_failure_with_retrievable_terminal_report: recoverable-by-one-terminal-readback
  terminal_task_without_valid_completion_report: non-passing
  repeated_status_polling: prohibited
  source_task_progress_delivery: terminal-only
  runtime_local_progress: runtime-policy-owned-and-not-source-delivery
  pre_send_completion_validation: required
  post_validation_record_mutation: prohibited
  callback_payload: exact-candidate-bytes-with-independent-receipt
  custody_release: a receipt matching the exact candidate and dispatch bytes is required
    before one terminal delivery for every terminal outcome
security:
  secret_values_in_envelope: prohibited
  issue_project_merge_release_or_publication_mutation: separately-authorized-only
  delegated_repair: prohibited-by-default
  validated_execution_packet: required-before-dispatch

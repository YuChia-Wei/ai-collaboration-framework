asset_id: "ai-context-upgrader"
schema_version: "1.0"
asset_type: "skill-spec"
title: "AI Context Upgrader"
purpose: "Plan and execute a version-aware upgrade of this AI context framework in an initialized target repository by comparing the previous framework version, requested framework version, and current target state while preserving target-owned truth and semantic customizations."
portability: "portable"
audience: "agent-facing"
source_of_truth: "canonical"
triggers:
  - "upgrade AI context"
  - "update copied AI context"
  - "compare framework versions"
  - "migrate AI context version"
  - "refresh framework context"
inputs:
  - "target `.dev/ai-context/provenance.yaml`, legacy `.dev/AI-CONTEXT-SOURCE.yaml`, or an explicit unresolved-provenance decision"
  - "target `.dev/ai-context/customizations.yaml` when provenance schema 2 is active"
  - "requested published framework version"
  - "Git-accessible previous and requested framework trees"
  - "current target repository state and target-owned overrides"
outputs:
  - "a read-only evidence-bound route result for immediate-predecessor, v0.9.0, and v0.6.0 support before any target mutation"
  - "for a selected direct or orchestrated multi-hop route, one Git-admin outer transaction with a single retained raw route matrix, immutable route intent and finalized checkpoints, and one mutable progress journal"
  - "validated source and target version identity"
  - "classified upgrade plan with automatic-candidate, reconcile, and exclude paths"
  - "migration-guide checklist for the selected version path"
  - "applied changes only when explicitly authorized"
  - "updated target provenance after successful validation"
  - "for a source-version advancement, an immutable terminal receipt bound to the sealed remediation packet, exact candidate-authority owner decision, incoming-candidate validation, separately routed target-validation receipt, and resulting authority digests"
  - "preserved target-owned routine-validation policy with reconciliation evidence"
  - "semantic reconciliation table keyed by customization ID and subject"
constraints:
  - "Use `ai-context-init` instead when the target has not been initialized"
  - "Do not overwrite target-owned collaboration, requirement, spec, ADR, architecture, operations, or project configuration truth without explicit reconciliation"
  - "Do not copy source-repository workflow records, assessment instances, backlog, Git metadata, caches, or release history into a target; reusable assessment governance files remain normal candidates"
  - "Do not scan product `src/` or `tests/`; route source review to `code-reviewer`"
  - "Treat MCP graphs, IDE indexes, semantic search, and other external tools only as discovery accelerators; verify every decision with Git or repository files"
  - "Remain read-only during discovery and planning; require explicit authorization before applying an upgrade"
  - "Do not update provenance until the selected changes and required validation succeed"
  - "For a multi-hop route, retain the outer transaction only at Git-admin `ai-context-multi-hop-upgrade`; route intent and finalized checkpoints are immutable, the outer journal is the only mutable progress record, and rollback is limited to the active unfinalized hop."
  - "At multi-hop begin, retain one canonical path-free `resolver-result.json` with the full selected S1 route and bind its fixed path, raw digest, and byte length in the unsigned route intent. Do not retain an external matrix root, absolute source path, source locator, provider state, or credential state; only prepare may receive an explicit external matrix_root and it must re-resolve the sealed raw matrix to the exact sealed full result."
  - "Treat only a promoted `hops/<zero-based-index>/` tree as prepared-hop evidence. `.preparing-hops` and `failed-preparations` are retained non-authoritative attempts: never scan, reuse, promote, or accept them as a validator pass, child binding, resume, checkpoint, or rollback substitute."
  - "Bind each promoted hop's `validator_path` only to its retained `hops/NNNN/validator.asset`; a passed validator record must bind the selected full-edge validator and byte-identical expected stdout. Preserve the evidence chain from sealed resolver result through intent, hop, checkpoint, and target validation without copying an external root into a checkpoint."
  - "Bind `plan_sha256` only as the semantic child plan identity and derived child transaction ID. Bind `proposal_plan_sha256` only as SHA-256 of the exact canonical temporary `preparation.json` bytes; cross-check both independently while the proposal exists, never compare or substitute them, and remove the proposal only after the child transaction is retained."
  - "Keep each child apply plan at schema 2.2.0 and each child journal at schema ai-context-package-apply-journal/v4 in their existing Git-admin ai-context-package-apply transaction roots; never duplicate the raw route matrix or silently substitute a validator, package, remediation packet, or owner decision."
  - "For a schema-2 upgrade, require the exact accepted remediation packet and candidate-authority decision, finalized journal, incoming-candidate execution receipt, and separately routed passing target-validation receipt bound to the same target, package, plan, and observed prestate; a predecessor-only pass or profile snapshot is insufficient."
  - "Preserve validation.routine without weakening target selections; never read, package, or overwrite ignored `.dev/validation.local.conf`."
  - "Preserve ignored `.dev/ai-context/local/cli-execution-routing.yaml` without reading, packaging, overwriting, or migrating personal values implicitly; retain the tracked ignore rule."
  - "Use the shared semantic customization lifecycle; never infer semantic equivalence from paths or finalize before owner reconciliation and independent post-upgrade verification."
workflow:
  - step: 1
    description: "Resolve the explicit upgrade-route matrix, origin, target, exact ordered assets, validators, checksums, and semantic cutovers before reading or mutating target state"
  - step: 2
    description: "For a selected route, persist one raw matrix, path-free full S1 resolver result, and immutable route intent in the Git-admin outer transaction before the first child-hop mutation; stage each hop privately, atomically promote only exact `hops/NNNN/` package/retained-validator/proposal evidence, retain failed attempts as non-authoritative evidence, retain only one mutable outer journal, and write immutable checkpoints after each finalized hop"
  - step: 3
    description: "Read the version policy, target provenance and customization ledger, trusted package metadata, migration guide, and repository-specific collaboration instructions"
  - step: 4
    description: "Fail closed on unresolved refs, invalid manifests, unpublished versions, dirty or unpreserved target changes, or missing source identity"
  - step: 5
    description: "Compare previous framework, requested framework, and current target state; classify every relevant changed path"
  - step: 6
    description: "Present automatic candidates, exclusions, and a semantic reconciliation table with incoming equivalence, owner decision, validation, and rollback boundary"
  - step: 7
    description: "After authorization, apply only the accepted paths, preserve target truth, and run the target's required validation"
  - step: 8
    description: "After governance reconciliation, independent post-upgrade audit, and target validation succeed, atomically finalize customizations and provenance; otherwise preserve prior provenance"

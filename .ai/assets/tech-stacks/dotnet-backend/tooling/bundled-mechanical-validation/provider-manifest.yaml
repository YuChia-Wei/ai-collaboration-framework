schema_version: "1.0"
provider:
  id: "ai-context-dotnet-bundled-mechanical-validation"
  canonical_root: ".ai/assets/tech-stacks/dotnet-backend/tooling/bundled-mechanical-validation/"
  owner_component: "dotnet-backend"
  delivery_state: "source-available"
  default_activation_state: "source-available"
  source_delivery: "source-only"
  supported_activation_modes:
    - "reference-in-place"
  unsupported_activation_modes:
    - "materialize-to-tools"
capabilities:
  analyzers:
    source_root: "analyzers/"
    project: "analyzers/DotnetBackendAnalyzers.csproj"
    selection: "independent explicit target selection"
    wiring: "target-owned analyzer ProjectReference plan"
    invocation: "target-owned dotnet build or equivalent CI command"
    configuration: "target-owned analyzer severity and build policy"
    evidence: "target plan, applied wiring, invocation result, and freshness"
  runtime-validation:
    source_root: "runtime-validation/"
    project: "runtime-validation/DotnetBackendValidation.csproj"
    selection: "independent explicit target selection"
    wiring: "target-owned test ProjectReference or source reference plan"
    invocation: "target-owned runtime or configuration test command"
    configuration: "target-owned marker and test-host configuration"
    evidence: "target plan, applied wiring, invocation result, and freshness"
activation_contract:
  record_schema: "schemas/activation-record.schema.yaml"
  record_template: "templates/reference-in-place-activation-record.yaml"
  evaluator: "scripts/evaluate-provider-activation.py"
  state_values:
    - "source-available"
    - "active-reference-in-place"
    - "active-materialized"
    - "stale"
    - "unresolved"
  partial_setup_outcomes:
    - "stale"
    - "unresolved"
  materialization:
    required_target_limitation_evidence: true
    required_separate_authorization: true
    implementation_status: "unavailable"
    evaluator_outcome: "fail-closed"
  target_ownership:
    provider_evaluator_automation_mutation: "not-performed"
    accepted_applied_statuses:
      - "verified-existing"
      - "applied-by-target-owner"
precutover_availability:
  architecture_kit:
    availability: "unavailable"
    lifecycle: "pre-cutover"
    selectable: false
    reason: "Architecture Kit provider implementation, publication, proof, and cutover are outside this provider contract."

schema_version: "1.0"
record_type: "architecture-kit-readiness-record"
closed_world: true
required:
  - schema_version
  - record_type
  - record_id
  - provider_binding
  - architecture_kit
  - current_state
  - deferred_targets
  - evidence
  - criteria
  - future_cutover
properties:
  schema_version:
    const: "1.0"
  record_type:
    const: "architecture-kit-readiness-record"
  record_id:
    type: non-empty-string
  provider_binding:
    type: closed-mapping
    required: [provider_id, canonical_root, framework_version, framework_commit, provider_manifest_sha256]
    properties:
      provider_id:
        const: "ai-context-dotnet-bundled-mechanical-validation"
      canonical_root:
        const: ".ai/assets/tech-stacks/dotnet-backend/tooling/bundled-mechanical-validation/"
      framework_version:
        type: exact-concrete-framework-version-without-placeholder
      framework_commit:
        type: lowercase-40-character-git-sha
      provider_manifest_sha256:
        type: lowercase-64-character-sha256-of-raw-provider-manifest-bytes
  architecture_kit:
    type: closed-mapping
    required: [package_id, package_version, package_version_status]
    properties:
      package_id:
        type: non-empty-string-or-unresolved-placeholder
      package_version:
        type: non-empty-string-or-unresolved-placeholder
      package_version_status:
        enum: [unavailable, unresolved, available]
  current_state:
    type: closed-mapping
    required: [availability, lifecycle, selectable, source_presence_is_availability, planned_package_is_availability, repo_project_is_availability, preview_or_dual_run_is_cutover_proof]
    properties:
      availability:
        const: unavailable
      lifecycle:
        const: pre-cutover
      selectable:
        const: false
      source_presence_is_availability:
        const: false
      planned_package_is_availability:
        const: false
      repo_project_is_availability:
        const: false
      preview_or_dual_run_is_cutover_proof:
        const: false
  deferred_targets:
    type: non-empty-list-of-closed-mappings
    item_required: [target, gap, required_action]
    item_properties:
      target:
        type: non-empty-string
      gap:
        type: non-empty-string
      required_action:
        type: non-empty-string
  criteria:
    type: list-of-closed-mappings-with-exactly-once-required-ids
    required_ids:
      - immutable_package_identity
      - diagnostic_constraint_crosswalk
      - behavior_parity
      - consumer_guidance
      - compatible_profile_range
      - real_target_proof
      - migration_rollback_proof
      - owner_cutover_approval
    item_required: [id, state, evidence_ids]
    item_properties:
      id:
        enum: [immutable_package_identity, diagnostic_constraint_crosswalk, behavior_parity, consumer_guidance, compatible_profile_range, real_target_proof, migration_rollback_proof, owner_cutover_approval]
      state:
        enum: [verified, unavailable, stale, incompatible, unresolved, source-only]
      evidence_ids:
        type: unique-list-of-evidence-ids
  evidence:
    type: closed-mapping
    required: [root, records]
    properties:
      root:
        type: safe-repository-relative-directory
      records:
        type: list-of-closed-mappings
        item_required: [id, path, sha256]
        item_properties:
          id:
            type: non-empty-string
          path:
            type: safe-relative-path-beneath-evidence-root
          sha256:
            type: lowercase-64-character-sha256-of-raw-evidence-file-bytes
        file_content:
          type: closed-mapping
          required: [schema_version, evidence_id, provider_id, framework_version, framework_commit, provider_manifest_sha256, criterion, status, payload]
          properties:
            schema_version:
              const: "1.0"
            evidence_id:
              type: exact-declared-evidence-id
            provider_id:
              const: "ai-context-dotnet-bundled-mechanical-validation"
            framework_version:
              type: exact-record-provider-binding-framework-version
            framework_commit:
              type: exact-record-provider-binding-framework-commit
            provider_manifest_sha256:
              type: exact-record-provider-binding-manifest-sha256
            criterion:
              type: exact-referencing-criterion-id
            status:
              const: verified
            payload:
              type: criterion-specific-closed-mapping
    relationships:
      referenced_ids_must_be_declared: true
      declared_ids_must_be_referenced: true
      evidence_ids_must_not_be_reused_across_criteria: true
      non_verified_criteria_must_not_reference_evidence: true
  evidence_payloads:
    immutable_package_identity:
      required: [package_id, package_version, package_digest, publication_reference]
      exact_record_fields: [package_id, package_version]
      requires_record_package_version_status: available
      package_digest: lowercase-64-character-sha256
    diagnostic_constraint_crosswalk:
      required: [bindings, unmapped_diagnostics]
      bindings: non-empty-list-of-closed-mappings[diagnostic_id, constraint_id]
      unmapped_diagnostics: empty-list
    behavior_parity:
      required: [scenarios, failed_scenarios, mismatched_scenarios, equivalence]
      scenarios: non-empty-list-of-closed-mappings[scenario_id, result=passed]
      failed_scenarios: empty-list
      mismatched_scenarios: empty-list
      equivalence: equivalent
    consumer_guidance:
      required: [guidance_reference, guidance_digest]
      guidance_digest: lowercase-64-character-sha256
    compatible_profile_range:
      required: [profile, compatibility_range]
      profile: dotnet-backend
      compatibility_range: non-empty-string
    real_target_proof:
      required: [target_identity, target_commit, invocation, result]
      target_commit: lowercase-40-character-git-sha
      result: passed
    migration_rollback_proof:
      required: [migration, rollback]
      migration: closed-mapping[plan_reference, result=passed]
      rollback: closed-mapping[plan_reference, result=passed]
    owner_cutover_approval:
      required: [decision_reference, decision_digest, scope, execution_authorization]
      decision_digest: lowercase-64-character-sha256
      scope: readiness-gate
      execution_authorization: false
  future_cutover:
    type: closed-mapping
    required: [breaking, preview_or_dual_run, remove_bundled_source, legacy_provider, requires_explicit_owner_authorization, evaluator_may_execute, evaluator_may_authorize]
    properties:
      breaking:
        const: true
      preview_or_dual_run:
        const: false
      remove_bundled_source:
        const: true
      legacy_provider:
        const: false
      requires_explicit_owner_authorization:
        const: true
      evaluator_may_execute:
        const: false
      evaluator_may_authorize:
        const: false
evaluation:
  any_non_verified_criterion: unsupported
  all_verified_criteria: evidence-complete
  all_verified_selection: not-selected
  grants_cutover_authorization: false
  evaluator_side_effects: none

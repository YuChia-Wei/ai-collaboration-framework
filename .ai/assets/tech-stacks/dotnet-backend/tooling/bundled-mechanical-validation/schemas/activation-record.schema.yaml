schema_version: "1.0"
record_type: "bundled-mechanical-validation-activation-record"
closed_world: true
required:
  - schema_version
  - record_id
  - provider
  - framework
  - canonical_root
  - provider_manifest_sha256
  - outcome
  - freshness
  - selected_capabilities
  - target_plan
  - target_plan_sha256
  - evidence
  - capabilities
properties:
  schema_version:
    const: "1.0"
  record_id:
    type: non-empty-string
  provider:
    type: closed-mapping
    required: [id]
    properties:
      id:
        const: "ai-context-dotnet-bundled-mechanical-validation"
  framework:
    type: closed-mapping
    required: [version, commit]
    properties:
      version:
        type: non-empty-string
      commit:
        type: lowercase-40-character-git-sha
  canonical_root:
    const: ".ai/assets/tech-stacks/dotnet-backend/tooling/bundled-mechanical-validation/"
  provider_manifest_sha256:
    type: lowercase-64-character-sha256-of-raw-provider-manifest-bytes
  outcome:
    enum: [source-available, active-reference-in-place, active-materialized, stale, unresolved]
  freshness:
    enum: [fresh, stale, unresolved]
  selected_capabilities:
    type: unique-list
    allowed_values: [analyzers, runtime-validation]
  target_plan:
    type: closed-mapping
    required: [plan_id, activation_mode, target_repository, provider_evaluator_automation_mutation, source_copy]
    properties:
      plan_id:
        type: non-empty-string
      activation_mode:
        enum: [none, reference-in-place, materialize-to-tools]
      target_repository:
        type: non-empty-string
      provider_evaluator_automation_mutation:
        const: not-performed
      source_copy:
        const: false
      target_limitation_evidence:
        type: non-empty-list-when-materializing
      separate_authorization:
        type: non-empty-string-when-materializing
  target_plan_sha256:
    type: lowercase-64-character-sha256-of-deterministic-canonical-json-target-plan
  evidence:
    type: closed-mapping
    required: [records]
    properties:
      root:
        type: safe-repository-relative-directory
        default: ".dev/ai-context/provider-evidence/ai-context-dotnet-bundled-mechanical-validation"
      records:
        type: list-of-closed-mappings
        item_required: [id, path, sha256]
        item_properties:
          id:
            type: non-empty-string
          path:
            type: safe-relative-path-beneath-evidence-root
          sha256:
            type: lowercase-64-character-sha256-of-raw-evidence-file-bytes
  capabilities:
    type: mapping
    keys: [analyzers, runtime-validation]
    active_capability_required:
      - state
      - selection
      - wiring
      - configuration
      - invocation
      - evidence_ids
    per_capability:
      state:
        enum: [active-reference-in-place, stale, unresolved]
      selection:
        type: closed-non-empty-mapping
        required: [source]
      wiring:
        type: closed-non-empty-mapping
        required: [strategy, source_path, target_reference]
      configuration:
        type: closed-non-empty-mapping
        required: [ownership, target_reference]
        properties:
          ownership:
            const: target-owned
      invocation:
        type: closed-non-empty-mapping
        required: [command, evidence_scope]
      evidence_ids:
        type: closed-non-empty-mapping
        required: [wiring, configuration, invocation]
        distinct_values: true
        each_value_must_resolve_to_declared_evidence_record: true
evaluation:
  active_reference_in_place:
    requires_outcome: active-reference-in-place
    requires_freshness: fresh
    requires_activation_mode: reference-in-place
    requires_every_selected_capability_complete: true
    requires_raw_provider_manifest_sha256_match: true
    requires_provider_root_to_resolve_to_canonical_repository_location: true
    requires_canonical_provider_manifest_and_capability_projects_to_be_non_symlink_regular_files: true
    requires_deterministic_target_plan_sha256_match: true
    requires_explicit_repository_root_and_raw_manifest_context: true
    requires_distinct_wiring_configuration_and_invocation_evidence_per_selected_capability: true
    evidence_metadata_must_bind: [provider_id, framework_commit, capability, kind, status, target_plan_sha256]
    evidence_file_requirements: [safe-repository-relative-root, regular-file, non-symlink, raw-sha256-match]
    invocation_evidence_status: passed
  partial_setup:
    allowed_outcomes: [stale, unresolved]
  active_materialized:
    implementation_status: unavailable
    result: fail-closed
  materialize_to_tools:
    required_target_limitation_evidence: true
    required_separate_authorization: true
    implementation_status: unavailable
    result: fail-closed

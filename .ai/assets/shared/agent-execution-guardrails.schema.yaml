  - record_type
  - operation
  - execution_boundary
  - duration_class
  - change_domains
  - snapshot
  - tracked_write
  - provider_mutation
  - credential_access
  - terminal_gate
  operations:
  - review
  - local-work
  - validation
  execution_boundaries:
  - same-runtime
  - external
  - unknown
  duration_classes:
  - short
  - long-running
  - unknown
  change_domains:
  - ordinary
  - authority
  - evidence-custody
  - security
  - release
  - adoption
  - unknown
  snapshots:
  - isolated-immutable
  - shared-mutable
  - shared-frozen
  - unknown

  - record_type
  - classification
  - subject
  - criteria
  - authority
  subject_fields:
  - repository
  - base_sha
  - head_sha
  - base_tree
  - head_tree
  - subject_digest
  authority_fields:
  - path
  - sha256
reserved_powershell_variables:
- args
- error
- executioncontext
- false
- foreach
- home
- host
- input
- lastexitcode
- matches
- myinvocation
- null
- pid
- profile
- psboundparameters
- pscmdlet
- psitem
- psscriptroot
- pwd
- shellid
- stacktrace
- this
- true
privacy_forbidden_keys:
- raw_output
- absolute_path
- secret
- token
- credential
- prompt
record_models:
  packet:
    '1.0':
      type: object
      properties:
        schema_version:
          type: string
          const: '1.0'
        record_type:
          type: string
          const: agent-execution-packet
        packet_id:
          type: string
        execution_kind:
          type: string
        owning_skill:
          type: string
        role:
          type: object
          properties:
            path:
              type: string
            applicability:
              type: string
            reason:
              type: string
          required:
          - path
          - applicability
          - reason
          additionalProperties: false
        subject:
          type: object
          properties:
            repository:
              type: string
            exact_sha:
              type: string
          required:
          - repository
          - exact_sha
          additionalProperties: false
        invocation:
          type: object
          properties:
            argv: &id002
              type: array
              items: &id001
                type: string
            cwd: *id001
          required:
          - argv
          - cwd
          additionalProperties: false
        permissions:
          type: object
          properties:
            network:
              type: string
            tracked_write:
              type: string
            provider_mutation:
              type: string
          required:
          - network
          - tracked_write
          - provider_mutation
          additionalProperties: false
        ignored_artifact_roots: *id002
        terminal:
          type: object
          properties:
            schema_ref:
              type: string
            mode:
              type: string
            destination:
              type: string
            max_terminal_messages: &id003
              type: integer
          required:
          - schema_ref
          - mode
          - destination
          - max_terminal_messages
          additionalProperties: false
        integration_owner: *id001
        stop_conditions: *id002
        retry:
          type: object
          properties:
            attempt: *id003
            budget: *id003
            authorization_refs: *id002
          required:
          - attempt
          - budget
          - authorization_refs
          additionalProperties: false
        packet_sha256: *id001
      required:
      - schema_version
      - record_type
      - packet_id
      - execution_kind
      - owning_skill
      - role
      - subject
      - invocation
      - permissions
      - ignored_artifact_roots
      - terminal
      - integration_owner
      - stop_conditions
      - retry
      - packet_sha256
      additionalProperties: false

schema_version: "1.0"
contract_id: agent-execution-guardrails
record_types:
  packet: agent-execution-packet
  lease: worktree-snapshot-lease
  evidence: acceptance-evidence-ledger
  retry: agent-retry-decision
  graph: code-graph-freshness
execution_kinds: [delegated, external, fixed-head-audit]
role_applicability: [applies, not-applicable]
permission_modes: [allow, deny]
lease_states: [active, released, invalidated]
lease_access: [tracked-writer, read-only]
artifact_states: [open, sealed, released]
evidence_kinds: [actual-execution, synthetic-test, mock, unit, document]
execution_receipt_producers: [local-command-runner, external-task-completion]
actual_execution_binding: existing-contained-receipt-and-output-files-with-byte-digests
outcomes: [passed, failed, blocked, deferred, not-applicable]
retry_decisions: [retry, stop]
graph_states: [fresh, stale, missing]
graph_coverage: [complete, partial, unknown]
graph_fallbacks: [none, tracked-search]
terminal_modes: [callback, event-wait]
classification:
  schema_version: "1.0"
  record_type: agent-execution-classification
  fields: [schema_version, record_type, operation, execution_boundary, duration_class, change_domains, snapshot, tracked_write, provider_mutation, credential_access, terminal_gate]
  operations: [review, local-work, validation]
  execution_boundaries: [same-runtime, external, unknown]
  duration_classes: [short, long-running, unknown]
  change_domains: [ordinary, authority, evidence-custody, security, release, adoption, unknown]
  snapshots: [isolated-immutable, shared-mutable, shared-frozen, unknown]
review_input:
  schema_version: "1.0"
  record_type: independent-review-input
  fields: [schema_version, record_type, classification, subject, criteria, authority]
  subject_fields: [repository, base_sha, head_sha, base_tree, head_tree, subject_digest]
  authority_fields: [path, sha256]
reserved_powershell_variables:
  - args
  - error
  - executioncontext
  - false
  - foreach
  - home
  - host
  - input
  - lastexitcode
  - matches
  - myinvocation
  - null
  - pid
  - profile
  - psboundparameters
  - pscmdlet
  - psitem
  - psscriptroot
  - pwd
  - shellid
  - stacktrace
  - this
  - true
privacy_forbidden_keys: [raw_output, absolute_path, secret, token, credential, prompt]

          \ \"portable\"\naudience: \"agent-facing\"\nsource_of_truth: \"canonical\"\
          \nstatus: \"deprecated\"\nreplacement: \"ai-context-init\"\nreplacement_spec:\
          \ \".ai/assets/skills/ai-context-init/skill.yaml\"\nremoval_target: null\n\
          historical_identifier_rewrite: false\ntriggers:\n  - \"an existing request\
          \ explicitly names repo-structure-sync\"\ninputs:\n  - \"a legacy repo-structure-sync\
          \ invocation\"\noutputs:\n  - \"a compatibility route to ai-context-init\"\
          \nconstraints:\n  - \"Route new invocations to ai-context-init.\"\n  - \"\
          Do not rewrite historical initialized_by, workflow, task, assessment, release,\
          \ or provenance values.\"\n  - \"Do not infer a removal release without\
          \ downstream migration evidence and an explicit owner decision.\"\nworkflow:\n\
          \  - step: 1\n    description: \"Preserve the legacy identifier as input\

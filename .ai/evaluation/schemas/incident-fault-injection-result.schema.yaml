schema_version: "1.0"
schema_id: "incident-fault-injection-result"
type: "mapping"
report_schema: "incident-fault-injection-result/v1"
required:
  - "schema_version"
  - "corpus_id"
  - "corpus_version"
  - "subject"
  - "manifest_digest"
  - "candidate_inputs"
  - "results"
  - "effectiveness"
  - "worktree"
  - "test_controls"
  - "decision"
  - "report_digest"
result_required:
  - "mutant_id"
  - "incident_reference"
  - "category"
  - "criticality"
  - "expected_detector"
  - "actual_detector"
  - "outcome"
  - "input_refs"
  - "follow_up"
  - "diagnostic_fingerprint"
mutant_outcomes: ["detected", "detected-by-unexpected-detector", "survived"]
decision_outcomes: ["passed", "passed-with-exploratory-survivors", "failed"]
invariants:
  - "a critical survivor or unexpected critical detector fails the gate"
  - "an exploratory survivor remains outcome survived with follow-up-required disposition"
  - "each exploratory survivor projects one explicit follow-up candidate"
  - "before and after tracked-status digests must match for a passing decision"
  - "evidence contains normalized identifiers and digests, never raw detector output"

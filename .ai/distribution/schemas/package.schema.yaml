schema_version: 2.4.0
document: package.yaml
required:
  - schema_version
  - package_id
  - profile_id
  - version
  - release_id
  - selection
  - user_view
  - source
  - created_at
  - source_date_epoch
  - payload
  - identity
  - compatibility
  - validation
properties:
  schema_version: semver
  package_id:
    type: non-empty-string
    version_aware_identity:
      policy: public-package-identity-v1
      before_v0_15: ai-context-dotnet-backend-v{version}
      from_v0_15: ai-collaboration-framework-v{version}
      unknown_mixed_or_ambiguous: fail-closed
  profile_id: non-empty-string
  version: semver-without-v-prefix
  release_id: REL-vMAJOR.MINOR.PATCH
  selection:
    semantics:
      scope: clean-install-default
      archive_inventory: all-declared-component-bytes
      effective_selection: resolved-by-target-planner
    required:
      - release_model
      - mandatory_components
      - profiles
      - providers
    properties:
      release_model:
        const: single-versioned-componentized-release
      mandatory_components:
        exact_set:
          - software-development-core
          - ai-context-lifecycle-core
      profiles:
        type: unique-non-empty-component-id-list
      providers:
        type: component-provider-selection-mapping
        properties:
          repo-backlog:
            required: [enabled, preservation]
            properties:
              enabled: boolean
              preservation:
                enum: [preserve-existing-if-recorded]
  user_view:
    required:
      - schema_version
      - classifications
      - reference_integrity
      - components
      - supported_selections
      - capabilities
    properties:
      schema_version:
        const: 1.0.0
      classifications:
        type: fail-closed-reference-classification-mapping
      reference_integrity:
        type: selected-payload-reference-contract
      components:
        type: component-dependency-list
      supported_selections:
        type: closed-component-selection-list
      capabilities:
        type: component-capability-availability-list
  source:
    required: [repository, ref, commit, tree]
    properties:
      repository: non-empty-string
      ref: immutable-tag-or-full-commit
      commit: full-40-character-sha
      tree: full-40-character-sha
  created_at: iso-8601
  source_date_epoch: non-negative-integer
  payload:
    required: [root, file_count, sha256]
    properties:
      root: relative-posix-path
      file_count: non-negative-integer
      sha256: lowercase-sha256
    sha256_definition: sha256-of-utf8-lines-sha256-two-spaces-target-path-newline
  compatibility:
    required: [minimum_governed_source, breaking_changes]
  identity:
    required:
      - schema_version
      - package_identity_policy
      - identity_rule
      - public_artifact_base
      - selected_input_fingerprint
      - payload_fingerprint
      - files_manifest_digest
      - migration_digest
    properties:
      schema_version:
        const: 1.1.0
      package_identity_policy:
        enum: [public-package-identity-v1, profile-local-template]
      identity_rule: non-empty-string
      public_artifact_base:
        equals: package_id-and-envelope-root
  validation:
    required:
      - schema_version
      - manifest
      - manifest_sha256
      - selected_inputs
      - selected_inputs_sha256
    properties:
      schema_version:
        const: package-validation/v1
      manifest:
        const: metadata/validation.json
      manifest_sha256: lowercase-sha256
      selected_inputs:
        const: metadata/selected-inputs.json
        proof_contract: selected-inputs.schema.yaml
      selected_inputs_sha256: lowercase-sha256
additional_properties: false
read_compatibility:
  - "1.0.0"
  - "1.1.0"
  - "2.0.0"
  - "2.1.0"
  - "2.2.0"
  - "2.3.0"

schema_version: "1.0"
schema: ".ai/distribution/schemas/source-dispositions.schema.yaml"
contract_id: "dotnet-backend-source-dispositions"
issue: 184
status: "active"
owner_skill: "ai-context-governance"
profile:
  id: "dotnet-backend"
  path: ".ai/distribution/profiles/dotnet-backend.yaml"
coverage:
  source_patterns:
    - ".dev/**"
  baseline_assessment: "ASM-20260810-003#PKG-001"
  derivation: "tracked-minus-packaged-minus-explicit-exclusion"
dispositions:
  - id: "source-repository-current-operations"
    patterns:
      - ".dev/REPOSITORY-RENAME-COMPATIBILITY.md"
      - ".dev/backlog/ROADMAP.md"
      - ".dev/operations/runbooks/AI-CONTEXT-RELEASE-PUBLICATION-RUNBOOK.MD"
    classification: "source-only"
    owner: "source-repository-governance"
    reason: >-
      Current repository coordinates, release scheduling, and operator actions
      govern this source repository and are not downstream target truth.
    retention: "retain-active"
    package_behavior: "exclude"
  - id: "source-repository-architecture-history"
    patterns:
      - ".dev/adr/ADR-001-separate-source-config-from-downstream-templates.md"
    classification: "historical-evidence"
    owner: "source-repository-architecture"
    reason: >-
      The accepted ADR explains the source/template separation decision; the
      resulting portable contracts are distributed from their canonical assets.
    retention: "retain-immutable"
    package_behavior: "exclude"
  - id: "source-environment-readiness-policy"
    patterns:
      - ".dev/ai-context/environment-policy.yaml"
    classification: "not-product-input"
    owner: "source-environment-governance"
    reason: >-
      This source policy classifies local readiness and execution evidence. It
      is consumed by source workflows, not installed as target environment truth.
    retention: "retain-active"
    package_behavior: "exclude"
  - id: "historical-backlog-planning-sources"
    patterns:
      - ".dev/backlog/plans/README.md"
      - ".dev/backlog/plans/post-v0.4.0-improvement-plan.md"
      - ".dev/backlog/plans/rel-004-ai-context-release-closeout-discussion-context.md"
    classification: "historical-evidence"
    owner: "source-work-management"
    reason: >-
      These planning sources preserve decisions and discussion context but do
      not own current target behavior or package content.
    retention: "retain-immutable"
    package_behavior: "exclude"
  - id: "github-provider-mapping-guidance"
    patterns:
      - ".dev/backlog/provider-mappings/README.MD"
      - ".dev/backlog/provider-mappings/github-issues.schema.yaml"
    classification: "source-only"
    owner: "github-work-management-provider"
    reason: >-
      Mapping guidance and its receipt schema describe the selected source
      provider and have no portable target authority.
    retention: "retain-active"
    package_behavior: "exclude"
  - id: "github-provider-receipts"
    patterns:
      - ".dev/backlog/provider-mappings/github-issues-CTX-005.yaml"
      - ".dev/backlog/provider-mappings/github-issues-GOV-004.yaml"
      - ".dev/backlog/provider-mappings/github-issues-GOV-006.yaml"
      - ".dev/backlog/provider-mappings/github-issues-PKG-005.yaml"
      - ".dev/backlog/provider-mappings/github-issues-PKG-006.yaml"
      - ".dev/backlog/provider-mappings/github-issues-SAG-002.yaml"
      - ".dev/backlog/provider-mappings/github-issues-SKILL-002.yaml"
      - ".dev/backlog/provider-mappings/github-issues-TOOL-002.yaml"
      - ".dev/backlog/provider-mappings/github-issues-VAL-003.yaml"
      - ".dev/backlog/provider-mappings/github-issues-WIBIND-001.yaml"
      - ".dev/backlog/provider-mappings/github-issues.yaml"
    classification: "generated-projection"
    owner: "github-work-management-provider"
    reason: >-
      These provider identity and read-back receipts project repository work
      records into GitHub and never become downstream package inputs.
    retention: "retain-current-projection"
    package_behavior: "exclude"
  - id: "github-current-project-readback"
    patterns:
      - ".dev/backlog/provider-mappings/github-project-current.yaml"
    classification: "generated-projection"
    owner: "github-work-management-provider"
    reason: >-
      The mutable current-state receipt is a source provider projection whose
      freshness is verified independently from package construction.
    retention: "retain-current-projection"
    package_behavior: "exclude"
  - id: "github-provider-contract"
    patterns:
      - ".dev/backlog/providers/README.MD"
      - ".dev/backlog/providers/github.yaml"
    classification: "source-only"
    owner: "github-work-management-provider"
    reason: >-
      The selected GitHub Issue/Project policy is source-repository operation;
      portable targets retain provider-neutral workflow semantics.
    retention: "retain-active"
    package_behavior: "exclude"
  - id: "source-lessons-knowledge-base"
    patterns:
      - ".dev/lessons/INDEX.MD"
      - ".dev/lessons/README.MD"
      - ".dev/lessons/environment/INDEX.MD"
      - ".dev/lessons/environment/LESSON-ENV-001-wsl-non-interactive-dotnet-path.md"
      - ".dev/lessons/templates/lesson-template.md"
      - ".dev/lessons/validation/INDEX.MD"
      - ".dev/lessons/validation/LESSON-VAL-001-terminal-validation-immutable-snapshot.md"
    classification: "not-product-input"
    owner: "source-lessons-lifecycle"
    reason: >-
      Lessons are non-normative source knowledge with host-specific evidence;
      they must be promoted through a separately governed portable authority.
    retention: "retain-until-superseded"
    package_behavior: "exclude"
  - id: "workflow-handoff-catalog-projection"
    patterns:
      - ".dev/workflows/handoff-checkpoints.yaml"
    classification: "generated-projection"
    owner: "source-workflow-governance"
    reason: >-
      This catalog projects source workflow checkpoint discovery and does not
      define reusable target workflow state.
    retention: "retain-current-projection"
    package_behavior: "exclude"

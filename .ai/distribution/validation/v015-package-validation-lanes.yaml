schema_version: v015-package-validation-lanes/v1
owner: ai-context-governance
issues:
  delivery: [250, 252]
  integrated_main_gate: 254
subject:
  source_version: 0.14.0
  candidate_version: 0.15.0
  legacy_public_base: ai-context-dotnet-backend-v0.14.0
  candidate_public_base: ai-collaboration-framework-v0.15.0
outcomes:
  - passed
  - failed
  - blocked-by-environment
  - not-applicable
  - deferred-with-owner
lanes:
  fast:
    command: python .ai/scripts/run-v015-package-validation.py fast --expected-commit SHA --output-dir .dev/ai-context/local/validation/issue-250-252/fast
    budget_seconds: 90
    material_target_mutation: false
    proves_actual_upgrade: false
  medium:
    command: python .ai/scripts/run-v015-package-validation.py medium --expected-commit SHA --output-dir .dev/ai-context/local/validation/issue-250-252/medium
    budget_seconds: 240
    target_kind: synthetic-clean-install
    proves_actual_upgrade: false
    long_running_gate_when_expected_or_observed_seconds_at_least: 120
    execution_boundary: validated-packet-exclusive-lease-read-only-delegation-one-wait
  long:
    command: python .ai/scripts/run-v015-package-validation.py long --expected-commit SHA --output-dir .dev/ai-context/local/validation/issue-250-252/long-PLATFORM --trusted-reference
    windows_to_linux_command: python .ai/scripts/run-v015-package-validation-wsl.py long --distribution Ubuntu-24.04 --expected-commit SHA --output-dir .dev/ai-context/local/validation/issue-250-252/long-linux --trusted-reference
    budget_seconds: 1200
    target_kind: actual-published-v0.14-durability-upgrade
    fixture_storage: real-storage-only
    consumes_ai_context_test_tmp_root: false
    proves_actual_upgrade: true
    wsl_execution:
      transport: exact-head-git-bundle-over-stdin
      workspace: unique-linux-native-temp
      shared_windows_mount: forbidden
      rejected_filesystems: [9p, drvfs]
      result_transport: tar-over-stdout
      cleanup: same-session-required
aggregation:
  required_trusted_reference_platforms: [windows, linux]
  missing_platform_outcome: blocked-by-environment
  actual_upgrade_projection: long-passed-only
  integrated_main_release_readiness_owner: issue-254
retry:
  same_failure_fingerprint_requires_material_state_change: true
  attempt_three_or_later_requires_new_owner_or_workflow_authorization: true
